{{! The call-to-action link is styled inline: mail clients drop a <style> block or apply only part of it, and paint links in their own colour, so a button styled only by a class comes out as link-coloured text on the button colour. The colour is on the table cell (bgcolor survives without any CSS), on the link and on a span inside it. }}<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:20px 0;border-collapse:separate;"><tr><td bgcolor="{{style.color}}" style="background-color:{{style.color}};border-radius:6px;"><a href="{{link}}" target="_blank" style="display:inline-block;padding:12px 30px;font-size:16px;font-weight:600;line-height:1.2;color:#ffffff;text-decoration:none;border-radius:6px;background-color:{{style.color}};"><span style="color:#ffffff;">{{t.button}}</span></a></td></tr></table>
