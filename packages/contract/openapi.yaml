openapi: 3.1.0
info:
  title: Authway login UI API
  version: 0.5.0
  summary: The contract between Authway's login screens and a provider.
  description: |
    Every Authway implementation answers these endpoints the same way, so the
    bundled login screens — or a custom one — work with any of them: sign-in,
    consent and logout flows, email verification, password reset and
    invitations. Flow ids
    are opaque: a screen only passes them back, URL-encoded in a path segment.
    See docs/api/login-flows.md for the walk-through.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

tags:
  - name: login
    description: Called by the login screens, unauthenticated.
  - name: admin
    description: |
      Administration, authenticated with the deployment's admin key (or an
      admin session) as a bearer token. Tenant-scoped calls name the tenant
      in X-Tenant-ID. A missing or rejected credential answers 401 with
      code unauthorized. This document covers tenants, clients, users,
      invitations, webhooks and the audit log.

security: []

paths:
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: What this deployment offers
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }

  /api/v1/login-flows/{flow}:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    get:
      operationId: getLoginFlow
      summary: What the sign-in screen should show for a login flow
      responses:
        '200':
          description: Show the form, or continue without one
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginForm'
                  - $ref: '#/components/schemas/Redirect'
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/password:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: submitPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                remember: { type: boolean }
      responses:
        '200':
          description: Signed in, or a second factor is needed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Redirect'
                  - $ref: '#/components/schemas/MFARequired'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/mfa:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: submitTOTP
      requestBody: { $ref: '#/components/requestBodies/SecondFactor' }
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/mfa/recovery:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: submitRecoveryCode
      requestBody: { $ref: '#/components/requestBodies/SecondFactor' }
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/social/{provider}:
    parameters:
      - { $ref: '#/components/parameters/Flow' }
      - name: provider
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: startSocialSignIn
      summary: A page navigation that continues to the provider
      description: |
        Not an API call: the browser navigates here. A provider the client
        does not offer ends the authorization request with an OAuth error.
      responses:
        '302': { description: To the provider, or back to the application or the error screen }

  /api/v1/login-flows/{flow}/magic-link:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: sendMagicLink
      description: Same answer whether or not the address may sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200':
          description: A link was emailed if the address may sign in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSent' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/magic-links/inspect:
    post:
      operationId: inspectMagicLink
      description: Reports whether a link can be redeemed, without using it up.
      requestBody: { $ref: '#/components/requestBodies/MagicLinkToken' }
      responses:
        '200':
          description: The link's state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MagicLinkInspection' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/magic-links/redeem:
    post:
      operationId: redeemMagicLink
      description: Uses the link up and completes its login flow. Must run in the browser that started the sign-in.
      requestBody: { $ref: '#/components/requestBodies/MagicLinkToken' }
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/consent-flows/{flow}:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    get:
      operationId: getConsentFlow
      responses:
        '200':
          description: Ask, or continue without asking
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConsentForm'
                  - $ref: '#/components/schemas/Redirect'
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/consent-flows/{flow}/accept:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: acceptConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_scope: { type: array, items: { type: string } }
                remember: { type: boolean }
                remember_for: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/consent-flows/{flow}/reject:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: rejectConsent
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/logout-flows/{flow}:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: completeLogout
      description: Ends the session and revokes the user's tokens; the authorization server decides the destination.
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/email/send-verification:
    post:
      operationId: sendVerificationEmail
      description: Same answer whether or not the address has an account.
      requestBody: { $ref: '#/components/requestBodies/EmailAddress' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }

  /api/email/verify:
    get:
      operationId: verifyEmail
      parameters: [{ $ref: '#/components/parameters/Token' }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/email/forgot-password:
    post:
      operationId: forgotPassword
      description: Same answer whether or not the address has an account.
      requestBody: { $ref: '#/components/requestBodies/EmailAddress' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }

  /api/email/verify-reset-token:
    get:
      operationId: verifyResetToken
      parameters: [{ $ref: '#/components/parameters/Token' }]
      responses:
        '200':
          description: The token can be used
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { const: true }
                  message: { type: string }
        '400': { $ref: '#/components/responses/Error' }

  /api/email/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/invitations/token/{token}:
    get:
      operationId: getInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: An invitation that can be accepted
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                name: { type: string }
                password: { type: string }
      responses:
        '200':
          description: The account exists and belongs to the invitation's tenant
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  message: { type: string }
                  user:
                    type: object
                    required: [id, email]
                    properties:
                      id: { type: string }
                      email: { type: string }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/tenants:
    post:
      tags: [admin]
      operationId: createTenant
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                slug: { type: string, minLength: 2, maxLength: 100 }
                description: { type: string }
                settings: { $ref: '#/components/schemas/TenantSettings' }
                logo: { type: string }
                primary_color: { type: string, description: A hex color, e.g. '#4F46E5'. }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: The slug is taken (code tenant_slug_taken)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [admin]
      operationId: listTenants
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: Every tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getTenant
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [admin]
      operationId: updateTenant
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Only the fields present change; settings, when present, replaces the whole object.
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                description: { type: string }
                settings: { $ref: '#/components/schemas/TenantSettings' }
                logo: { type: string }
                primary_color: { type: string }
                active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: The default tenant cannot be deactivated (code default_tenant_protected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      operationId: deleteTenant
      security: [{ adminKey: [] }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: The default tenant cannot be deleted (code default_tenant_protected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: |
            The tenant still has users, clients or active service clients
            (code tenant_has_users, tenant_has_clients or
            tenant_has_service_clients).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/clients:
    get:
      tags: [admin]
      operationId: listClients
      security: [{ adminKey: [] }]
      parameters:
        - { name: tenant_id, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of clients, every tenant's unless tenant_id is given
          content:
            application/json:
              schema:
                type: object
                required: [clients, total, limit, offset]
                properties:
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: createClient
      security: [{ adminKey: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name, grant_types, scopes]
              properties:
                tenant_id: { type: string }
                name: { type: string }
                public: { type: boolean }
                redirect_uris: { type: array, items: { type: string } }
                post_logout_redirect_uris: { type: array, items: { type: string } }
                allowed_origins: { type: array, items: { type: string } }
                grant_types: { type: array, items: { type: string } }
                scopes: { type: array, items: { type: string } }
                enabled_auth_providers:
                  description: Sign-in methods to offer — email, magic_link, google, github, microsoft, apple.
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [client]
                properties:
                  client: { $ref: '#/components/schemas/Client' }
                  credentials:
                    type: object
                    description: The client secret, shown once (confidential clients).
                  message: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: A service credential without the admin.clients:write scope (code insufficient_scope)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/clients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: The registration id (Client.id), not the OAuth client_id. }
    get:
      tags: [admin]
      operationId: getClient
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The client
          content:
            application/json:
              schema:
                type: object
                required: [client]
                properties:
                  client: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [admin]
      operationId: updateClient
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/StrictSync'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Only the fields present change. For the list fields an empty
                array clears the list and an absent field leaves it alone.
              properties:
                name: { type: string }
                description: { type: string }
                public: { type: boolean }
                active: { type: boolean }
                redirect_uris: { type: array, items: { type: string } }
                post_logout_redirect_uris: { type: array, items: { type: string } }
                allowed_origins: { type: array, items: { type: string } }
                grant_types: { type: array, items: { type: string } }
                scopes: { type: array, items: { type: string } }
                enabled_auth_providers: { type: array, items: { type: string } }
                skip_consent: { type: boolean }
                skip_logout_consent: { type: boolean }
                access_token_strategy:
                  description: jwt or opaque pins this client; an empty string returns it to the deployment default.
                  type: string
                  enum: ['', jwt, opaque]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [client, sync_status]
                properties:
                  message: { type: string }
                  client: { $ref: '#/components/schemas/Client' }
                  sync_status: { $ref: '#/components/schemas/SyncStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/SyncFailed' }
    delete:
      tags: [admin]
      operationId: deleteClient
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/StrictSync'
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/SyncFailed' }

  /api/v1/clients/{id}/regenerate-secret:
    post:
      tags: [admin]
      operationId: regenerateClientSecret
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/StrictSync'
      responses:
        '200':
          description: The new secret, shown once. The previous one stops working.
          content:
            application/json:
              schema:
                type: object
                required: [credentials, sync_status]
                properties:
                  message: { type: string }
                  credentials:
                    type: object
                    required: [client_id, client_secret]
                    properties:
                      client_id: { type: string }
                      client_secret: { type: string, minLength: 1 }
                  sync_status: { $ref: '#/components/schemas/SyncStatus' }
        '400':
          description: Malformed id, or a public client, which has no secret (code public_client_has_no_secret)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/SyncFailed' }

  /api/v1/invitations:
    get:
      tags: [admin]
      operationId: listInvitations
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, accepted, declined, expired, revoked] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of the tenant's invitations, newest first
          content:
            application/json:
              schema:
                type: object
                required: [invitations, total, limit, offset]
                properties:
                  invitations:
                    type: array
                    items: { $ref: '#/components/schemas/AdminInvitation' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400':
          description: Malformed request, or no tenant named (code tenant_required)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: createInvitation
      security: [{ adminKey: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { type: string }
                message: { type: string }
      responses:
        '201':
          description: Created and emailed
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    type: object
                    required: [id, email, status, expires_at]
                    properties:
                      id: { type: string }
                      email: { type: string }
                      status: { type: string }
                      expires_at: { type: string }
                  message: { type: string }
        '400':
          description: Malformed request, or no tenant named (code tenant_required)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Already a member (user_already_member) or already invited (invitation_already_pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invitations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getInvitation
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The invitation
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: { $ref: '#/components/schemas/AdminInvitation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      operationId: revokeInvitation
      description: Revokes a pending invitation; its link stops working.
      security: [{ adminKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Not pending any more (code invitation_not_pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invitations/{id}/resend:
    post:
      tags: [admin]
      operationId: resendInvitation
      description: Mails a new link for a pending invitation; the previous link stops working.
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Not pending any more (code invitation_not_pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/webhooks:
    get:
      tags: [admin]
      operationId: listWebhooks
      security: [{ adminKey: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses:
        '200':
          description: The tenant's webhooks, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
        '400':
          description: No tenant named (code tenant_required)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: createWebhook
      description: |
        Registers an endpoint for the tenant's events. A value outside its
        range is refused (code invalid_request), never replaced; an omitted
        optional value takes its default.
      security: [{ adminKey: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, events]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                url:
                  type: string
                  description: |
                    An absolute http or https URL. A local or private address is
                    refused unless the deployment allows private targets.
                events:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/WebhookEvent' }
                enabled: { type: boolean, default: true }
                retry_count: { type: integer, minimum: 0, maximum: 10, default: 3 }
                timeout_secs: { type: integer, minimum: 1, maximum: 60, default: 30 }
      responses:
        '201':
          description: Created. The only answer that carries the signing secret.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, secret]
                properties:
                  webhook: { $ref: '#/components/schemas/Webhook' }
                  secret:
                    type: string
                    description: Signs every delivery; see docs/api/webhooks.md. Not shown again — rotate to replace it.
                  message: { type: string }
        '400':
          description: Invalid value (code invalid_request), or no tenant named (code tenant_required)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/events:
    get:
      tags: [admin]
      operationId: listWebhookEvents
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: What a webhook can subscribe to
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [type, description]
                      properties:
                        type: { $ref: '#/components/schemas/WebhookEvent' }
                        description: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getWebhook
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The webhook
          content:
            application/json:
              schema:
                type: object
                required: [webhook]
                properties:
                  webhook: { $ref: '#/components/schemas/Webhook' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [admin]
      operationId: updateWebhook
      description: Changes the fields the body names; the same ranges as creation apply.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                url: { type: string }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/WebhookEvent' }
                enabled: { type: boolean }
                retry_count: { type: integer, minimum: 0, maximum: 10 }
                timeout_secs: { type: integer, minimum: 1, maximum: 60 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [webhook]
                properties:
                  webhook: { $ref: '#/components/schemas/Webhook' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      operationId: deleteWebhook
      security: [{ adminKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/{id}/test:
    post:
      tags: [admin]
      operationId: testWebhook
      description: |
        Sends one test event to this webhook — enabled or not, whatever it
        subscribes to — and answers with the delivery. A receiver that refuses
        or cannot be reached still answers 200; the delivery says how it went.
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The delivery
          content:
            application/json:
              schema:
                type: object
                required: [delivery]
                properties:
                  delivery: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/{id}/rotate-secret:
    post:
      tags: [admin]
      operationId: rotateWebhookSecret
      description: Replaces the signing secret; the previous one stops signing at once.
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The new secret, shown this once
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/{id}/deliveries:
    get:
      tags: [admin]
      operationId: listWebhookDeliveries
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Delivery attempts, newest first
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/audit/logs:
    get:
      tags: [admin]
      operationId: listAuditLogs
      description: |
        One page of the tenant's audit log, newest first. A filter that is not
        well formed is refused (code invalid_request), never ignored.
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: actor_id, in: query, required: false, schema: { type: string } }
        - { name: action, in: query, required: false, schema: { type: string }, description: One of GET /api/v1/audit/actions. }
        - { name: resource_type, in: query, required: false, schema: { type: string } }
        - { name: resource_id, in: query, required: false, schema: { type: string } }
        - { name: severity, in: query, required: false, schema: { $ref: '#/components/schemas/AuditSeverity' } }
        - { name: success, in: query, required: false, schema: { type: boolean } }
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of entries
          content:
            application/json:
              schema:
                type: object
                required: [logs, total, limit, offset]
                properties:
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400':
          description: A malformed filter (code invalid_request), or no tenant named (code tenant_required)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/audit/logs/{id}:
    get:
      tags: [admin]
      operationId: getAuditLog
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                type: object
                required: [log]
                properties:
                  log: { $ref: '#/components/schemas/AuditLog' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/audit/logs/purge:
    delete:
      tags: [admin]
      operationId: purgeAuditLogs
      description: Deletes the tenant's entries older than retention_days.
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: retention_days, in: query, required: false, schema: { type: integer, minimum: 30, maximum: 36500, default: 90 } }
      responses:
        '200':
          description: Purged
          content:
            application/json:
              schema:
                type: object
                required: [deleted, retention_days]
                properties:
                  deleted: { type: integer, minimum: 0 }
                  retention_days: { type: integer }
                  message: { type: string }
        '400':
          description: retention_days out of range (code invalid_request), or no tenant named (code tenant_required)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/audit/users/{userId}/activity:
    get:
      tags: [admin]
      operationId: getUserAuditActivity
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: The user's most recent entries in the tenant
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/audit/security:
    get:
      tags: [admin]
      operationId: getSecurityAuditEvents
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: hours, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 168, default: 24 } }
      responses:
        '200':
          description: Warning-and-above entries from the last hours
          content:
            application/json:
              schema:
                type: object
                required: [logs, hours]
                properties:
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  hours: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/audit/summary:
    get:
      tags: [admin]
      operationId: getAuditSummary
      security: [{ adminKey: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses:
        '200':
          description: Entry counts over recent windows
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    type: object
                    required: [total_24h, total_7d, total_30d, security_events, failed_operations]
                    properties:
                      total_24h: { type: integer, minimum: 0 }
                      total_7d: { type: integer, minimum: 0 }
                      total_30d: { type: integer, minimum: 0 }
                      security_events: { type: integer, minimum: 0 }
                      failed_operations: { type: integer, minimum: 0, description: Entries in the last 24 hours recorded as failures. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/audit/actions:
    get:
      tags: [admin]
      operationId: listAuditActions
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The actions and severities an entry can carry
          content:
            application/json:
              schema:
                type: object
                required: [actions, severities]
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      required: [action, description]
                      properties:
                        action: { type: string }
                        description: { type: string }
                  severities:
                    type: array
                    items:
                      type: object
                      required: [severity, description]
                      properties:
                        severity: { $ref: '#/components/schemas/AuditSeverity' }
                        description: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/users:
    get:
      tags: [admin]
      operationId: listUsers
      security: [{ adminKey: [] }]
      parameters:
        - { name: tenant_id, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of users, every tenant's unless tenant_id is given
          content:
            application/json:
              schema:
                type: object
                required: [users, total, limit, offset]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getUser
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [admin]
      operationId: updateUser
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: An empty or absent field leaves the stored value alone.
              properties:
                name: { type: string }
                avatar_url: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      operationId: deleteUser
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    adminKey:
      type: http
      scheme: bearer
      description: The deployment's admin API key, or an admin console session token.

  parameters:
    StrictSync:
      name: strict_sync
      in: query
      required: false
      description: |
        true: answer 502 when the change was saved but the authorization
        server rejected it. Otherwise the answer succeeds and sync_status
        reports the outcome.
      schema: { type: boolean }
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: false
      description: The tenant the call acts on. A tenant_id query parameter works too.
      schema: { type: string }
    Token:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    Flow:
      name: flow
      in: path
      required: true
      description: Opaque flow id, URL-encoded.
      schema: { type: string, minLength: 1 }

  requestBodies:
    EmailAddress:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string }
              client_id: { type: string, description: Scopes the lookup to the client's tenant. }
    SecondFactor:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [mfa_challenge, code]
            properties:
              mfa_challenge: { type: string, description: Issued by the password step; only valid for its own flow. }
              code: { type: string }
    MagicLinkToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }

  responses:
    Message:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
    Redirect:
      description: Continue in the browser
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Redirect' }
    TooManyRequests:
      description: Rate limited; retry_after is in seconds
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  retry_after: { type: integer, minimum: 0 }
    Error:
      description: Refused
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SyncFailed:
      description: |
        Saved, but the authorization server rejected the change (only with
        strict_sync=true; code upstream_sync_failed).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [sync_status]
                properties:
                  sync_status: { $ref: '#/components/schemas/SyncStatus' }

  schemas:
    Redirect:
      type: object
      required: [next, redirect_to]
      properties:
        next: { const: redirect }
        redirect_to: { type: string, minLength: 1 }

    MFARequired:
      type: object
      required: [next, mfa_challenge]
      properties:
        next: { const: mfa }
        mfa_challenge: { type: string, minLength: 1 }

    EmailSent:
      type: object
      required: [next]
      properties:
        next: { const: email_sent }

    LoginForm:
      type: object
      required: [next, flow, client_name, requested_scope, client]
      properties:
        next: { const: form }
        flow: { type: string }
        client_name: { type: string }
        requested_scope: { type: [array, 'null'], items: { type: string } }
        client:
          type: object
          required: [client_id, sign_in_methods]
          properties:
            client_id: { type: string }
            sign_in_methods:
              description: What to offer, in order — "email" for the password form, "magic_link", then social providers.
              type: array
              items: { type: string }
            allow_email_signup: { type: boolean }

    ConsentForm:
      type: object
      required: [next, flow, client_name, requested_scope, user]
      properties:
        next: { const: form }
        flow: { type: string }
        client_name: { type: string }
        requested_scope: { type: [array, 'null'], items: { type: string } }
        user:
          type: object
          required: [email]
          properties:
            email: { type: string }
            name: { type: [string, 'null'] }

    MagicLinkInspection:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        email: { type: string }
        expires_at: { type: string }
        error: { type: string }

    Invitation:
      type: object
      required: [id, email, tenant_name, expires_at]
      properties:
        id: { type: string }
        email: { type: string }
        tenant_name: { type: string }
        inviter_name: { type: string }
        role: { type: string }
        message: { type: string }
        expires_at: { type: string }

    AdminInvitation:
      type: object
      required: [id, tenant_id, email, status, expires_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string, enum: [pending, accepted, declined, expired, revoked] }
        message: { type: string }
        inviter_id: { type: ['null', string], description: null when issued with the admin key. }
        inviter_name: { type: string }
        tenant_name: { type: string }
        accepted_at: { type: ['null', string] }
        accepted_by: { type: ['null', string] }
        expires_at: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    Webhook:
      type: object
      required: [id, tenant_id, name, url, events, enabled, retry_count, timeout_secs, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        url: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEvent' }
        enabled: { type: boolean }
        retry_count: { type: integer, minimum: 0, maximum: 10, description: Attempts after the first. }
        timeout_secs: { type: integer, minimum: 1, maximum: 60 }
        created_at: { type: string }
        updated_at: { type: string }

    WebhookEvent:
      description: |
        What a webhook can subscribe to. Every event listed is sent; a provider
        lists only the events it sends.
      type: string
      enum: [user.created, user.updated, user.deleted, user.login, user.logout, user.password_changed,
             user.mfa_enabled, user.mfa_disabled,
             client.created, client.updated, client.deleted, test, '*']

    WebhookEventPayload:
      description: |
        The JSON body of a delivery. `id` is unique per event and the same on
        every retry of it. `data` names what the event is about and who caused
        it, and nothing more — a receiver that needs the details asks the
        admin API for them. A `test` event's `data` is unspecified.
      type: object
      required: [id, type, timestamp, tenant_id, data]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/WebhookEvent' }
        timestamp: { type: string, format: date-time }
        tenant_id: { type: string }
        data:
          type: object
          properties:
            resource: { $ref: '#/components/schemas/WebhookEventRef' }
            actor: { $ref: '#/components/schemas/WebhookEventRef' }

    WebhookEventRef:
      description: |
        A resource or an actor. `id` is the id the admin API uses for it; it is
        absent for an actor without one (the system, or an administrator
        signed in with the deployment's key).
      type: object
      required: [type]
      properties:
        type: { type: string, description: 'user, client, admin, service or system.' }
        id: { type: string }

    WebhookDelivery:
      type: object
      required: [id, webhook_id, event_type, payload, status_code, attempt, delivered_at, success]
      properties:
        id: { type: string }
        webhook_id: { type: string }
        event_type: { type: string }
        payload: { type: string, description: The JSON body that was sent. }
        status_code: { type: integer, description: 0 when no answer arrived. }
        response_body: { type: string }
        attempt: { type: integer, minimum: 1 }
        delivered_at: { type: string }
        success: { type: boolean }
        error_message: { type: string }

    AuditLog:
      type: object
      required: [id, tenant_id, actor_id, actor_type, action, severity, success, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        actor_id: { type: ['null', string] }
        actor_email: { type: string }
        actor_type: { type: string }
        action: { type: string }
        severity: { $ref: '#/components/schemas/AuditSeverity' }
        resource_type: { type: string }
        resource_id: { type: string }
        ip_address: { type: string }
        user_agent: { type: string }
        details: { type: string, description: JSON text recorded with the event. }
        success: { type: boolean }
        error_msg: { type: string, description: Why the action failed; empty on success. }
        created_at: { type: string }

    AuditSeverity:
      type: string
      enum: [info, warning, error, critical]

    Tenant:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        settings: { $ref: '#/components/schemas/TenantSettings' }
        logo: { type: string }
        primary_color: { type: string }
        active: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }

    TenantSettings:
      type: object
      properties:
        require_email_verification: { type: boolean }
        password_min_length: { type: integer }
        session_timeout: { type: integer, description: Minutes. }
        allowed_domains: { type: [array, 'null'], items: { type: string } }
        signup_mode:
          description: |
            open lets a first sign-in through a social provider or a sign-in
            link create the account; anything else (including empty) means
            invite_only.
          type: string

    User:
      type: object
      required: [id, tenant_id, email]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        email: { type: string }
        name: { type: string }
        avatar_url: { type: string }
        email_verified: { type: boolean }
        active: { type: boolean }
        provider: { type: string }
        totp_enabled: { type: boolean }
        last_login_at: { type: ['null', string] }
        created_at: { type: string }
        updated_at: { type: string }

    Client:
      type: object
      required: [id, tenant_id, client_id, name, public, grant_types, scopes]
      properties:
        id: { type: string, description: Authway's id for the registration (admin API paths). }
        tenant_id: { type: string }
        client_id: { type: string, description: The OAuth client_id. }
        name: { type: string }
        public: { type: boolean }
        redirect_uris: { type: [array, 'null'], items: { type: string } }
        post_logout_redirect_uris: { type: [array, 'null'], items: { type: string } }
        allowed_origins: { type: [array, 'null'], items: { type: string } }
        grant_types: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
        enabled_auth_providers: { type: [array, 'null'], items: { type: string } }
        active: { type: boolean }
        skip_consent: { type: boolean }
        skip_logout_consent: { type: boolean }
        access_token_strategy:
          description: null when the client follows the deployment default.
          type: ['null', string]
          enum: [null, jwt, opaque]

    SyncStatus:
      type: object
      description: Whether the authorization server accepted the change.
      required: [state]
      properties:
        state: { type: string, enum: [ok, failed, skipped] }
        error: { type: string }

    Capabilities:
      type: object
      required: [multi_tenant, providers, magic_link, mfa, signup_modes, token_exchange, ciba]
      properties:
        multi_tenant: { type: boolean }
        providers:
          description: Social providers this deployment has credentials for.
          type: array
          items: { type: string }
        magic_link: { type: boolean }
        mfa: { type: array, items: { type: string } }
        signup_modes: { type: array, items: { type: string } }
        token_exchange: { type: boolean }
        ciba: { type: boolean }

    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: A message to show the user. }
        code:
          type: string
          description: |
            Stable identifier, for example invalid_flow, flow_expired,
            invalid_credentials, sign_in_method_not_allowed,
            invalid_mfa_challenge, invalid_code, mfa_locked, invalid_link,
            invalid_request, client_not_registered, invalid_token,
            token_expired, invitation_not_acceptable, invitation_not_accepted,
            too_many_requests, not_found, method_not_allowed, unauthorized,
            forbidden, insufficient_scope, admin_api_not_configured, conflict,
            public_client_has_no_secret, upstream_sync_failed,
            tenant_slug_taken, default_tenant_protected, tenant_has_users,
            tenant_has_clients, tenant_has_service_clients, tenant_required,
            user_already_member, invitation_already_pending,
            invitation_not_pending,
            internal_server_error. A refusal that carries only an HTTP status
            uses the code named after it.
