openapi: 3.1.0
info:
  title: Authway login UI API
  version: 0.5.0
  summary: The contract between Authway's login screens and a provider.
  description: |
    Every Authway implementation answers these endpoints the same way, so the
    bundled login screens — or a custom one — work with any of them: sign-in,
    consent and logout flows, email verification, password reset and
    invitations. Flow ids
    are opaque: a screen only passes them back, URL-encoded in a path segment.
    See docs/api/login-flows.md for the walk-through.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

tags:
  - name: login
    description: Called by the login screens, unauthenticated.
  - name: account
    description: Called by an application on behalf of its signed-in user, with the user's access token.
  - name: admin
    description: |
      Administration, authenticated with the deployment's admin key (or an
      admin session) as a bearer token. Tenant-scoped calls name the tenant
      in X-Tenant-ID. A missing or rejected credential answers 401 with
      code unauthorized. This document covers tenants, clients, users,
      invitations, webhooks and the audit log.

security: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: The running API and the migrations it ships
      description: |
        Answers while the API serves. `migrations` lists the database
        migrations this build ships, oldest first, so a deployment can check
        the database against what it deployed.
      responses:
        '200':
          description: Serving
          content:
            application/json:
              schema:
                type: object
                required: [status, version, migrations]
                properties:
                  status: { const: ok }
                  service: { type: string }
                  version: { type: string }
                  migrations: { type: array, items: { type: string } }
                  timestamp: { type: string }
  /.well-known/authway-config:
    get:
      operationId: getBootstrapConfig
      summary: Where an application finds this deployment's parts
      description: |
        The one document an application or SDK needs before anything else.
        `issuer` is the OIDC issuer; every OAuth endpoint then comes from its
        OpenID Connect discovery document, never from a URL pattern.
      responses:
        '200':
          description: The bootstrap document
          content:
            application/json:
              schema:
                type: object
                required: [issuer, api_url, auth_ui, version]
                properties:
                  issuer: { type: string, description: The OIDC issuer. }
                  api_url: { type: string, description: The backend that serves this API. }
                  auth_ui: { type: string, description: The login UI's public address; emailed links point at it. }
                  version: { type: string }

  /api/v1/account-entry:
    get:
      tags: [account]
      operationId: getAccountEntry
      summary: How the account screen signs a user in
      description: |
        An application links a user to the account screen
        (`{login UI}/account?client_id=<its client_id>`), where the user turns a
        second factor on or off and renews recovery codes. The screen asks this
        first: the tenant's account screen client — registered the first time
        a user of the tenant gets here — to sign the user in with (PKCE, no
        consent screen), and the application to go back to. Public: nothing in
        the answer is secret.
      security: []
      parameters:
        - { name: client_id, in: query, required: true, description: The OAuth client_id of the application that linked here., schema: { type: string } }
      responses:
        '200':
          description: The account screen's client and the application
          content:
            application/json:
              schema:
                type: object
                required: [client_id, redirect_uri, scope, app]
                properties:
                  client_id: { type: string, description: The tenant's account screen client. }
                  redirect_uri: { type: string, description: 'Where its sign-in comes back: {login UI}/account/callback.' }
                  scope: { type: string }
                  app:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      client_uri: { type: string, description: Where the user goes back to; empty when the application registered none. }
        '400':
          description: No client_id (code invalid_request)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such application (code unknown_client)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: The account screen client could not be registered (code account_unavailable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: What this deployment offers
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }

  /api/v1/oauth2/introspect:
    post:
      operationId: introspectToken
      summary: Whether a token is still good (RFC 7662)
      description: |
        For a resource server that must know at once when a user has signed
        out or a token was revoked. A resource server that can accept a token
        until it expires validates the JWT itself (see JwtAccessToken) and
        never calls this. Offered when capabilities.token_introspection is
        true.

        The caller authenticates as a confidential client, with its id and
        secret as HTTP Basic or in the form. It learns about tokens issued to
        the clients of its own tenant; every other token — unknown, expired,
        revoked or another tenant's — is answered `{"active": false}`.
      security: [{ clientSecret: [] }, {}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, description: 'What kind of token the caller takes it for (RFC 7662). Accepted and not relied on: the answer is the same whatever it says.' }
                client_id: { type: string, description: With client_secret, instead of HTTP Basic. }
                client_secret: { type: string }
      responses:
        '200':
          description: What is known about the token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Introspection' }
        '400':
          description: No token was given (error invalid_request)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: The caller is not a confidential client with the right secret (error invalid_client)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '503':
          description: The token could not be checked just now (error temporarily_unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }

  /api/v1/login-flows/{flow}:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    get:
      operationId: getLoginFlow
      summary: What the sign-in screen should show for a login flow
      responses:
        '200':
          description: Show the form, or continue without one
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginForm'
                  - $ref: '#/components/schemas/Redirect'
                  - $ref: '#/components/schemas/TermsRequired'
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/password:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: submitPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                remember:
                  description: |
                    The user asks to stay signed in on this browser. Every
                    sign-in opens a session; this only makes it a longer one.
                  type: boolean
      responses:
        '200':
          description: Signed in, or a second factor or the tenant's terms are owed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Redirect'
                  - $ref: '#/components/schemas/MFARequired'
                  - $ref: '#/components/schemas/TermsRequired'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/mfa:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: submitTOTP
      requestBody: { $ref: '#/components/requestBodies/SecondFactor' }
      responses:
        '200': { $ref: '#/components/responses/SignedInOrTerms' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/mfa/recovery:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: submitRecoveryCode
      requestBody: { $ref: '#/components/requestBodies/SecondFactor' }
      responses:
        '200': { $ref: '#/components/responses/SignedInOrTerms' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/social/{provider}:
    parameters:
      - { $ref: '#/components/parameters/Flow' }
      - name: provider
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: startSocialSignIn
      summary: A page navigation that continues to the provider
      description: |
        Not an API call: the browser navigates here. A provider the client
        does not offer ends the authorization request with an OAuth error.

        When the provider has vouched for a user who has a second factor, the
        browser comes back to the login UI's second factor step —
        `{auth_ui}/mfa/verify?flow=…&mfa_challenge=…` — instead of going on
        to the application: the provider's word is one factor.

        Likewise, when the user owes the tenant's terms (TermsRequired), the
        browser comes back to `{auth_ui}/terms?flow=…&terms_challenge=…`; the
        page reads what to show with GET /api/v1/login-flows/{flow}/terms.
      responses:
        '302': { description: "To the provider, or back to the application, the login UI's second factor step, or the error screen" }

  /api/v1/login-flows/{flow}/terms:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    get:
      operationId: getOwedTerms
      summary: The terms a parked sign-in still has to accept
      description: |
        For a screen that arrives at the terms step by a page navigation (a
        social sign-in) and has only the flow and the terms_challenge.
        Offered when capabilities.terms_acceptance is true.
      parameters:
        - { name: terms_challenge, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: What to show
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermsRequired' }
        '400':
          description: The terms_challenge is unknown, expired or of another flow (code invalid_terms_challenge)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: acceptTerms
      description: |
        The user accepts every document the step showed. The acceptance is
        recorded — document, version, time, and the application signed in to —
        and the sign-in completes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terms_challenge, accepted]
              properties:
                terms_challenge: { type: string }
                accepted:
                  description: Each document shown, as kind and version. Must name exactly the documents owed now.
                  type: array
                  items:
                    type: object
                    required: [kind, version]
                    properties:
                      kind: { type: string }
                      version: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '400':
          description: |
            `invalid_terms_challenge` — unknown, expired or of another flow.
            `terms_mismatch` — the documents named are not the ones owed now
            (a document was revised meanwhile): the answer carries `terms`, what
            to show instead, and the same terms_challenge stays good. Do not
            re-read the login flow for it — the flow has not been signed in to
            yet and would offer the sign-in form again.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/TermsMismatch'
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/terms/decline:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: declineTerms
      description: |
        The user does not accept. The application gets `error=access_denied`;
        nothing is recorded and the account, if any, is left as it is — the
        next sign-in asks again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terms_challenge]
              properties:
                terms_challenge: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/magic-link:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: sendMagicLink
      description: Same answer whether or not the address may sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200':
          description: A link was emailed if the address may sign in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSent' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/login-flows/{flow}/magic-link/code:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: redeemMagicLinkCode
      description: |
        Does what redeeming the link does, with the code the same email
        carries — typed into the screen that started the sign-in, for a
        reader who opened the email on another device. Any case, with or
        without the hyphen. A code works once; after five wrong codes for a
        sign-in its codes stop working (its links still work).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'As the email shows it: XXXX-XXXX.' }
      responses:
        '200':
          description: Signed in, or a second factor or the tenant's terms are owed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Redirect'
                  - $ref: '#/components/schemas/MFARequired'
                  - $ref: '#/components/schemas/TermsRequired'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/magic-links/inspect:
    post:
      operationId: inspectMagicLink
      description: Reports whether a link can be redeemed, without using it up.
      requestBody: { $ref: '#/components/requestBodies/MagicLinkToken' }
      responses:
        '200':
          description: The link's state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MagicLinkInspection' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/magic-links/redeem:
    post:
      operationId: redeemMagicLink
      description: |
        Uses the link up and continues its login flow: signed in, or — for a
        user with a second factor — on to that step. Must run in the browser
        that started the sign-in.
      requestBody: { $ref: '#/components/requestBodies/MagicLinkToken' }
      responses:
        '200':
          description: Signed in, or a second factor or the tenant's terms are owed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Redirect'
                  - $ref: '#/components/schemas/MFARequired'
                  - $ref: '#/components/schemas/TermsRequired'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/users/password:
    post:
      tags: [account]
      operationId: changeOwnPassword
      summary: Set a new password for the signed-in user
      description: |
        An account with a password sends the current one (`current_password`);
        a wrong one is `400 invalid_current_password`, and repeated wrong ones
        are limited like failed sign-ins. An account without one (it signs in
        by link or by another provider; `has_password: false` on the profile)
        sets its first with a recent sign-in instead — otherwise `401
        insufficient_user_authentication` with `max_age`, as deleting the
        account answers. The new password follows the tenant's rule (`400
        password_too_short` with `min_length`, or `password_too_long`).

        The user's other sessions end, with the tokens issued in them;
        `sessions_ended` says which, as turning on a second factor does.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                type: object
                required: [message, sessions_ended]
                properties:
                  message: { type: string }
                  sessions_ended: { type: string, enum: [others, all, none] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/users/connections:
    get:
      tags: [account]
      operationId: listOwnConnections
      summary: The sign-in providers the signed-in user's account is linked to
      security: [{ userToken: [] }]
      responses:
        '200':
          description: The links, in a fixed order
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      required: [provider]
                      properties:
                        provider: { type: string, description: 'google, github, microsoft or apple' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/users/connections/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string } }
    delete:
      tags: [account]
      operationId: removeOwnConnection
      summary: End the account's link to a provider account
      description: |
        That provider account no longer signs in to this one; it reaches an
        account again only as a new one would (by an address the provider has
        verified). Needs a recent sign-in (`401
        insufficient_user_authentication` with `max_age` otherwise). The
        account's only way to sign in — no password and no other link — is
        `409 last_sign_in_method`; a provider it is not linked to is `404
        not_connected`.
      security: [{ userToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/users/mfa/setup:
    post:
      tags: [account]
      operationId: setUpSecondFactor
      summary: Issue the secret of an authenticator the user is about to add
      description: |
        Nothing is on yet: the factor is turned on by `verify` with a code
        from the authenticator that now holds the secret. Until then each
        call issues a new secret in place of the previous one. Offered when
        capabilities.mfa lists `totp`.

        While the factor is on, the answer is `409 mfa_already_enabled`: the
        factor in use is not replaced by a call that needs only the user's
        token.
      security: [{ userToken: [] }]
      responses:
        '200':
          description: The secret, to type in or to show as a QR code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactorSetup' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/users/mfa/verify:
    post:
      tags: [account]
      operationId: turnOnSecondFactor
      summary: Turn the second factor on with a code from the authenticator
      description: |
        From then on every sign-in asks the user for a code, however it
        starts. The user's other sessions end, with the tokens issued in
        them — they were opened on one factor — and the applications signed
        in on them are told; the session of this request is kept.
      security: [{ userToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/SecondFactorCode' }
      responses:
        '200':
          description: The factor is on; the recovery codes are shown only here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactorTurnedOn' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/users/mfa/status:
    get:
      tags: [account]
      operationId: getSecondFactorStatus
      security: [{ userToken: [] }]
      responses:
        '200':
          description: Whether the user has a second factor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactorStatus' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/users/mfa:
    delete:
      tags: [account]
      operationId: turnOffSecondFactor
      summary: Turn the second factor off
      description: |
        Needs proof of the factor itself in the body — a current
        authenticator code or an unused recovery code, which is used up:
        the user's token says who they are and must not be enough to remove
        the other factor (`403 mfa_code_required` without it).
      security: [{ userToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/SecondFactorCode' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/users/mfa/recovery/regenerate:
    post:
      tags: [account]
      operationId: regenerateRecoveryCodes
      summary: Replace the user's recovery codes
      description: The earlier codes stop working. Needs proof of the factor, as turning it off does.
      security: [{ userToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/SecondFactorCode' }
      responses:
        '200':
          description: The new recovery codes, shown only here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/consent-flows/{flow}:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    get:
      operationId: getConsentFlow
      responses:
        '200':
          description: Ask, or continue without asking
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConsentForm'
                  - $ref: '#/components/schemas/Redirect'
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/consent-flows/{flow}/accept:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: acceptConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_scope: { type: array, items: { type: string } }
                remember:
                  description: |
                    The user asks not to be asked again by this client. The
                    answer is then kept until the user's consents are
                    revoked; how long is not the screen's to say.
                  type: boolean
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/consent-flows/{flow}/reject:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: rejectConsent
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/device-flows/{flow}:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: submitDeviceUserCode
      description: |
        A device sign-in (RFC 8628). A device without a usable browser or
        keyboard asks the authorization server's
        `device_authorization_endpoint` (discovery) for a code and shows the
        user where to enter it. The authorization server sends the user's
        browser to the login UI's device page with a flow id — and the code,
        when the user opened the verification URI that carries it. The page
        sends the code the user typed here. Accepted, the sign-in goes on
        like any other: the login screen and the consent screen (which shows
        the application) follow, and the device then receives its tokens by
        polling the token endpoint.

        The code is read without regard to case, spaces or dashes. Offered
        when capabilities.device_authorization is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '400':
          description: |
            `user_code_invalid` — not the code the device shows, or the
            device's request has expired (start again on the device);
            `user_code_required`; or the flow is not valid (`invalid_flow`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/logout-flows/{flow}:
    parameters: [{ $ref: '#/components/parameters/Flow' }]
    post:
      operationId: completeLogout
      description: Ends the session and revokes the user's tokens; the authorization server decides the destination.
      responses:
        '200': { $ref: '#/components/responses/Redirect' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/email/send-verification:
    post:
      operationId: sendVerificationEmail
      description: Same answer whether or not the address has an account.
      requestBody: { $ref: '#/components/requestBodies/EmailAddress' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/email/verify:
    get:
      operationId: verifyEmail
      parameters: [{ $ref: '#/components/parameters/Token' }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/email/forgot-password:
    post:
      operationId: forgotPassword
      description: Same answer whether or not the address has an account.
      requestBody: { $ref: '#/components/requestBodies/EmailAddress' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/email/verify-reset-token:
    get:
      operationId: verifyResetToken
      parameters: [{ $ref: '#/components/parameters/Token' }]
      responses:
        '200':
          description: The token can be used
          content:
            application/json:
              schema:
                type: object
                required: [valid, password_min_length]
                properties:
                  valid: { const: true }
                  message: { type: string }
                  password_min_length: { $ref: '#/components/schemas/PasswordMinLengthInForce' }
        '400': { $ref: '#/components/responses/Error' }
        # The link was sent before an administrator suspended the account (code account_suspended).
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/email/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        # The account is suspended (code account_suspended); the password is unchanged.
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/invitations/token/{token}:
    get:
      operationId: getInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: An invitation that can be accepted
          content:
            application/json:
              schema:
                type: object
                required: [invitation, password_min_length]
                properties:
                  invitation: { $ref: '#/components/schemas/Invitation' }
                  password_min_length: { $ref: '#/components/schemas/PasswordMinLengthInForce' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                name: { type: string }
                password: { type: string }
      responses:
        '200':
          description: The account exists and belongs to the invitation's tenant
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  message: { type: string }
                  user:
                    type: object
                    required: [id, email]
                    properties:
                      id: { type: string }
                      email: { type: string }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/logout:
    post:
      tags: [account]
      operationId: signOutEverywhere
      summary: End every session of the signed-in user
      description: |
        Ends every session of the user at the authorization server — on every
        device and for every application — with their remembered consents and
        the tokens issued under them: the access token used for this call
        stops working, as does any refresh token. Applications registered for
        back-channel logout are told. The user is the one the token belongs
        to. It takes no body; where the application goes next is its own to
        decide. Sends `user.logout`.
      security: [{ userToken: [] }]
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: { const: true }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        # The sessions could not be ended (code internal_server_error); try again.
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/profile/me:
    get:
      tags: [account]
      operationId: getOwnProfile
      summary: The signed-in user's own profile
      security: [{ userToken: [] }]
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProfile' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [account]
      operationId: deleteOwnAccount
      summary: Delete the signed-in user's own account
      description: |
        Ends the user's sessions, consents and tokens at the authorization
        server, deletes the account and sends `user.deleted`. Offered when
        capabilities.account_deletion is true.

        The access token must come from a session whose user signed in
        recently. Otherwise the answer is the step-up challenge of RFC 9470:
        `401` with code `insufficient_user_authentication`, `max_age` in the
        body and in `WWW-Authenticate`. The application then sends the user
        through authorization again with that `max_age` and retries with the
        new token.
      security: [{ userToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '401':
          description: Not signed in, or not signed in recently enough
          headers:
            WWW-Authenticate:
              description: Present for insufficient_user_authentication, naming the max_age to request.
              schema: { type: string }
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      code: { type: string, description: 'unauthorized or insufficient_user_authentication.' }
                      max_age: { type: integer, description: Seconds; present for insufficient_user_authentication. }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/v1/tenants:
    post:
      tags: [admin]
      operationId: createTenant
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                slug: { type: string, minLength: 2, maxLength: 100 }
                description: { type: string }
                settings: { $ref: '#/components/schemas/TenantSettings' }
                logo: { type: string, description: 'An address of the tenant''s logo. Kept and returned as given: the provider''s own screens do not show it.' }
                primary_color: { type: string, description: 'A hex color, e.g. ''#4F46E5''. Kept and returned as given: the provider''s own screens are not styled by it.' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: The slug is taken (code tenant_slug_taken)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [admin]
      operationId: listTenants
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: Every tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getTenant
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [admin]
      operationId: updateTenant
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Only the fields present change; settings, when present, replaces the whole object.
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                description: { type: string, maxLength: 1000, description: An empty string clears it. }
                settings: { $ref: '#/components/schemas/TenantSettings' }
                logo: { type: string, description: Kept and returned as given; left as it is when not named. }
                primary_color: { type: string, description: 'A hex color. Kept and returned as given; left as it is when not named.' }
                active:
                  type: boolean
                  description: |
                    false turns the tenant off, and with it every client of
                    the tenant, as a client's own active: false does (see
                    updateClient): no one signs in to them, they get no token,
                    and the tokens they hold end. true turns it on again; each
                    client is then as its own active says. Naming active
                    brings the tenant's clients in line again even when it
                    does not change, so a request that answered 502 can be
                    repeated.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: The default tenant cannot be deactivated (code default_tenant_protected)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502':
          description: |
            The tenant was saved, but not every one of its clients was brought
            in line at the authorization server (code upstream_sync_failed).
            Send the same request again.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [admin]
      operationId: deleteTenant
      security: [{ adminKey: [] }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: The default tenant cannot be deleted (code default_tenant_protected)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: |
            The tenant still has users, clients or active service clients
            (code tenant_has_users, tenant_has_clients or
            tenant_has_service_clients).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/tenants/{id}/service-clients:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: createServiceClient
      summary: Issue the tenant a service credential
      description: |
        A credential for the tenant's own backend or provisioning: it gets
        tokens with the standard client_credentials grant and calls the
        administration API inside this tenant only, within its scopes —
        `admin.clients:write` (register clients, a reduced set of fields),
        `admin.claims:write` (read and write users' claims) and
        `admin.terms:write` (the tenant's terms documents). The secret is in
        this answer only.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [admin.clients:write, admin.claims:write, admin.terms:write] }
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                type: object
                required: [service_client, credentials]
                properties:
                  message: { type: string }
                  service_client: { $ref: '#/components/schemas/ServiceClient' }
                  credentials:
                    type: object
                    required: [client_id, client_secret]
                    properties:
                      client_id: { type: string }
                      client_secret: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      tags: [admin]
      operationId: listServiceClients
      summary: The tenant's service credentials, revoked ones included
      security: [{ adminKey: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: A page of credentials — never a secret
          content:
            application/json:
              schema:
                type: object
                required: [service_clients, total, limit, offset]
                properties:
                  service_clients: { type: array, items: { $ref: '#/components/schemas/ServiceClient' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{id}/service-clients/{service_client_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: service_client_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      operationId: revokeServiceClient
      summary: Revoke a service credential
      description: Its tokens stop working at once. A credential of another tenant is 404.
      security: [{ adminKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{id}/terms:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: listTenantTerms
      description: |
        The documents the tenant's users accept when they sign in — one per
        kind, the current version. None means nothing is asked. Offered when
        capabilities.terms_acceptance is true. A provider may also accept a
        credential scoped to the tenant (scope admin.terms:write).
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The current documents
          content:
            application/json:
              schema:
                type: object
                required: [terms]
                properties:
                  terms: { type: array, items: { $ref: '#/components/schemas/TermsDocument' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tenants/{id}/terms/{kind}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - name: kind
        in: path
        required: true
        description: Which document — any name the tenant chooses, such as terms_of_service or privacy_policy.
        schema: { type: string, pattern: '^[a-z0-9_]{1,40}$' }
    put:
      tags: [admin]
      operationId: publishTenantTerms
      description: |
        Makes this version the kind's current document. Users who have not
        accepted it are asked at their next sign-in. Naming the version that
        is already current changes only its address and title — nobody is
        asked again.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, url]
              properties:
                version: { type: string, minLength: 1, maxLength: 40 }
                url: { type: string, description: 'Where the document is published — an https address the application hosts.' }
                title: { type: string, maxLength: 200, description: What the sign-in screen calls it. }
      responses:
        '200':
          description: The version was already current; its address and title are updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermsDocument' }
        '201':
          description: The version is now current
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermsDocument' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      operationId: retireTenantTerms
      description: Stops asking for the kind. What users accepted stays recorded.
      security: [{ adminKey: [] }]
      responses:
        '204': { description: Retired }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/clients:
    get:
      tags: [admin]
      operationId: listClients
      security: [{ adminKey: [] }]
      parameters:
        - name: tenant_id
          in: query
          required: false
          description: The tenant whose clients to list. The X-Tenant-ID header says the same; the query wins when both are given.
          schema: { type: string }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of clients — of the tenant the call names (X-Tenant-ID, or tenant_id), every tenant's when it names none
          content:
            application/json:
              schema:
                type: object
                required: [clients, total, limit, offset]
                properties:
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: createClient
      security: [{ adminKey: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, grant_types, scopes]
              properties:
                tenant_id:
                  type: string
                  description: |
                    The tenant to register the client in. The X-Tenant-ID
                    header may name it instead; when both do they must name
                    the same tenant (400 invalid_request, field tenant_id).
                    Naming neither is 400 tenant_required.
                name: { type: string }
                client_id:
                  type: string
                  description: |
                    The OAuth client_id to register under; left out, Authway
                    generates one. One already registered is 409
                    client_id_taken (field client_id). A confidential client
                    that names one names client_secret too, and the reverse
                    (400 confidential_client_partial_credentials).
                client_secret: { type: string, description: A confidential client's secret, given with client_id; left out with it, Authway generates both. }
                public: { type: boolean }
                redirect_uris: { type: array, items: { type: string } }
                post_logout_redirect_uris: { type: array, items: { type: string } }
                allowed_origins:
                  description: |
                    The origins a browser application is served from. A page on
                    one of them may call, with the user's access token and
                    without cookies, the routes a user calls for themselves
                    (the profile, MFA and sign-out routes). Each entry matches
                    an origin exactly. Required for a public client with a web
                    redirect URI.
                  type: array
                  items: { type: string }
                audience:
                  description: |
                    The resource servers (APIs) this client's access tokens
                    are for — each an identifier the API knows itself by,
                    usually its URL. They become the token's `aud` claim. An
                    empty list clears them.
                  type: array
                  items: { type: string }
                token_endpoint_auth_method:
                  description: |
                    How the client proves who it is at the token endpoint.
                    Left out, it is what the kind of client implies:
                    `client_secret_post` for a confidential client, `none`
                    for a public one. `private_key_jwt` is for a confidential
                    client that can keep a key: it signs an assertion
                    (RFC 7523) with it, registers the public half as `jwks`
                    or `jwks_uri`, and is given no secret. Decided at
                    registration and not changed afterwards. Offered when the
                    provider's discovery document lists the method.
                  type: string
                  enum: [client_secret_post, private_key_jwt, none]
                jwks: { $ref: '#/components/schemas/ClientKeySet' }
                jwks_uri:
                  description: |
                    Where the provider fetches the client's key set, in place
                    of `jwks`: a public https address (a local or private one
                    is refused, `invalid_jwks_uri`).
                  type: string
                initiate_login_uri:
                  description: |
                    Where the application starts a sign-in when a third party
                    asks it to (OpenID Connect Core 1.0 section 4): a user who
                    accepted an invitation for this application is sent here
                    with `iss` and `login_hint`. An absolute https URL; an empty
                    string clears it.
                  type: string
                client_uri:
                  description: The application's home page — where such a user goes when there is no `initiate_login_uri`. An absolute https URL; an empty string clears it.
                  type: string
                logo:
                  description: The application's logo, shown with its name on the sign-in and consent screens (`logo_uri` in OpenID Connect Dynamic Client Registration). An absolute https URL; an empty string clears it.
                  type: string
                google_oauth_enabled:
                  description: |
                    The application signs its users in to Google with its own
                    Google app (the four providers follow one rule): when
                    enabled and its credentials are set, sign-in with that
                    provider uses them; otherwise the deployment's. Secrets are
                    stored sealed and never returned.
                  type: boolean
                google_client_id: { type: string }
                google_client_secret: { type: string, writeOnly: true }
                google_redirect_uri: { type: string }
                github_oauth_enabled: { type: boolean }
                github_client_id: { type: string }
                github_client_secret: { type: string, writeOnly: true }
                microsoft_oauth_enabled: { type: boolean }
                microsoft_client_id: { type: string }
                microsoft_client_secret: { type: string, writeOnly: true }
                microsoft_tenant_id: { type: string, description: The app's directory; "common" when not set. }
                apple_oauth_enabled: { type: boolean, description: Used only when all four Apple values are set. }
                apple_client_id: { type: string }
                apple_team_id: { type: string }
                apple_key_id: { type: string }
                apple_private_key: { type: string, writeOnly: true }
                backchannel_logout_uri:
                  description: |
                    Where the client's backend is told that a user's session
                    has ended: the provider POSTs a `logout_token`
                    (OpenID Connect Back-Channel Logout 1.0) to it. The token
                    names the session by `sid`, the same value as in the ID
                    tokens of that session. An empty string clears it.
                    Offered when capabilities.backchannel_logout is true.
                  type: string
                grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token, client_credentials, 'urn:ietf:params:oauth:grant-type:device_code'] } }
                scopes: { type: array, items: { type: string } }
                enabled_auth_providers:
                  description: Sign-in methods to offer — at least one. Left out, email and google. An empty list or an unknown name is 400 invalid_enabled_auth_providers.
                  type: array
                  minItems: 1
                  items: { type: string, enum: [email, magic_link, google, github, microsoft, apple] }
                access_token_strategy:
                  description: jwt gives the client access tokens that follow the resource server profile (JwtAccessToken).
                  type: string
                  enum: ['', jwt, opaque]
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [client]
                properties:
                  client: { $ref: '#/components/schemas/Client' }
                  credentials:
                    type: object
                    description: The client secret, shown once (confidential clients).
                  message: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: A service credential without the admin.clients:write scope (code insufficient_scope)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The client_id is already registered (code client_id_taken)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/clients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: The registration id (Client.id), not the OAuth client_id. }
    get:
      tags: [admin]
      operationId: getClient
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The client
          content:
            application/json:
              schema:
                type: object
                required: [client]
                properties:
                  client: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [admin]
      operationId: updateClient
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/StrictSync'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Only the fields present change. For the list fields an empty
                array clears the list and an absent field leaves it alone.
              properties:
                name: { type: string }
                description: { type: string }
                public: { type: boolean }
                active:
                  type: boolean
                  description: |
                    false turns the client off: no one signs in to it — a new
                    authorization request is answered unauthorized_client, and
                    a sign-in under way is ended at its login or consent step —
                    it gets no token by any grant, and the tokens it holds end
                    (introspection answers them inactive; a resource server
                    that verifies a JWT access token itself keeps accepting it
                    until it expires). true turns it on again; the sessions it
                    had stay ended.
                redirect_uris: { type: array, items: { type: string } }
                post_logout_redirect_uris: { type: array, items: { type: string } }
                audience:
                  description: |
                    The resource servers (APIs) this client's access tokens
                    are for — each an identifier the API knows itself by,
                    usually its URL. They become the token's `aud` claim. An
                    empty list clears them.
                  type: array
                  items: { type: string }
                token_endpoint_auth_method:
                  description: |
                    Accepted only as the method the client already has: how a
                    client authenticates is decided at registration
                    (`token_endpoint_auth_method_is_fixed`).
                  type: string
                  enum: [client_secret_post, private_key_jwt, none]
                jwks: { $ref: '#/components/schemas/ClientKeySet' }
                jwks_uri:
                  description: |
                    Replaces the keys of a client that authenticates with one
                    by an address to fetch them from; giving `jwks` or
                    `jwks_uri` clears the other.
                  type: string
                initiate_login_uri:
                  description: |
                    Where the application starts a sign-in when a third party
                    asks it to (OpenID Connect Core 1.0 section 4): a user who
                    accepted an invitation for this application is sent here
                    with `iss` and `login_hint`. An absolute https URL; an empty
                    string clears it.
                  type: string
                client_uri:
                  description: The application's home page — where such a user goes when there is no `initiate_login_uri`. An absolute https URL; an empty string clears it.
                  type: string
                logo:
                  description: The application's logo, shown with its name on the sign-in and consent screens (`logo_uri` in OpenID Connect Dynamic Client Registration). An absolute https URL; an empty string clears it.
                  type: string
                google_oauth_enabled:
                  description: |
                    The application signs its users in to Google with its own
                    Google app (the four providers follow one rule): when
                    enabled and its credentials are set, sign-in with that
                    provider uses them; otherwise the deployment's. Secrets are
                    stored sealed and never returned.
                  type: boolean
                google_client_id: { type: string }
                google_client_secret: { type: string, writeOnly: true }
                google_redirect_uri: { type: string }
                github_oauth_enabled: { type: boolean }
                github_client_id: { type: string }
                github_client_secret: { type: string, writeOnly: true }
                microsoft_oauth_enabled: { type: boolean }
                microsoft_client_id: { type: string }
                microsoft_client_secret: { type: string, writeOnly: true }
                microsoft_tenant_id: { type: string, description: The app's directory; "common" when not set. }
                apple_oauth_enabled: { type: boolean, description: Used only when all four Apple values are set. }
                apple_client_id: { type: string }
                apple_team_id: { type: string }
                apple_key_id: { type: string }
                apple_private_key: { type: string, writeOnly: true }
                backchannel_logout_uri:
                  description: |
                    Where the client's backend is told that a user's session
                    has ended: the provider POSTs a `logout_token`
                    (OpenID Connect Back-Channel Logout 1.0) to it. The token
                    names the session by `sid`, the same value as in the ID
                    tokens of that session. An empty string clears it.
                    Offered when capabilities.backchannel_logout is true.
                  type: string
                allowed_origins: { type: array, items: { type: string } }
                grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token, client_credentials, 'urn:ietf:params:oauth:grant-type:device_code'] } }
                scopes: { type: array, items: { type: string } }
                enabled_auth_providers:
                  description: Left out, unchanged. At least one; an empty list or an unknown name is 400 invalid_enabled_auth_providers.
                  type: array
                  minItems: 1
                  items: { type: string, enum: [email, magic_link, google, github, microsoft, apple] }
                skip_consent:
                  description: |
                    The client is the tenant's own application: its users are
                    not asked for consent. A user who arrives at any other
                    client is asked, signed in already or not.
                  type: boolean
                skip_logout_consent: { type: boolean }
                access_token_strategy:
                  description: |
                    jwt or opaque pins this client; an empty string returns it
                    to the deployment default. With jwt the client's access
                    tokens follow the resource server profile (JwtAccessToken).
                  type: string
                  enum: ['', jwt, opaque]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [client, sync_status]
                properties:
                  message: { type: string }
                  client: { $ref: '#/components/schemas/Client' }
                  sync_status: { $ref: '#/components/schemas/SyncStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The application is part of Authway — the tenant's account screen client (code system_client)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/SyncFailed' }
    delete:
      tags: [admin]
      operationId: deleteClient
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/StrictSync'
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The application is part of Authway — the tenant's account screen client (code system_client)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/SyncFailed' }

  /api/v1/clients/sync-hydra:
    post:
      tags: [admin]
      operationId: syncClientsToAuthorizationServer
      summary: Write every client to the authorization server again
      description: |
        Reconciles the authorization server with what Authway stores, for
        every client — after a change was saved but did not reach it
        (sync_status failed), or after a deployment changed what is synced.
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                required: [synced, failed]
                properties:
                  message: { type: string }
                  synced: { type: integer }
                  failed: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/clients/{id}/regenerate-secret:
    post:
      tags: [admin]
      operationId: regenerateClientSecret
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/StrictSync'
      responses:
        '200':
          description: The new secret, shown once. The previous one stops working.
          content:
            application/json:
              schema:
                type: object
                required: [credentials, sync_status]
                properties:
                  message: { type: string }
                  credentials:
                    type: object
                    required: [client_id, client_secret]
                    properties:
                      client_id: { type: string }
                      client_secret: { type: string, minLength: 1 }
                  sync_status: { $ref: '#/components/schemas/SyncStatus' }
        '400':
          description: Malformed id, or a public client, which has no secret (code public_client_has_no_secret)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The application is part of Authway — the tenant's account screen client (code system_client)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/SyncFailed' }

  /api/v1/invitations:
    get:
      tags: [admin]
      operationId: listInvitations
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, accepted, expired, revoked] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of the tenant's invitations, newest first
          content:
            application/json:
              schema:
                type: object
                required: [invitations, total, limit, offset]
                properties:
                  invitations:
                    type: array
                    items: { $ref: '#/components/schemas/AdminInvitation' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400':
          description: Malformed request, or no tenant named (code tenant_required)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: createInvitation
      security: [{ adminKey: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                message: { type: string }
                client_id:
                  description: |
                    The application the invitation is for, by its OAuth
                    `client_id` — one of the tenant's clients. Whoever accepts
                    it is sent on to that application (InvitationApp). A
                    client_id that names none of the tenant's clients is `400
                    unknown_client`.
                  type: string
      responses:
        '201':
          description: Created and emailed
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    type: object
                    required: [id, email, status, expires_at]
                    properties:
                      id: { type: string }
                      email: { type: string }
                      status: { type: string }
                      expires_at: { type: string }
                  message: { type: string }
        '400':
          description: Malformed request, or no tenant named (code tenant_required)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Already a member (user_already_member) or already invited (invitation_already_pending)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invitations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getAdminInvitation
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The invitation
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: { $ref: '#/components/schemas/AdminInvitation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      operationId: revokeInvitation
      description: Revokes a pending invitation; its link stops working.
      security: [{ adminKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Not pending any more (code invitation_not_pending)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/invitations/{id}/resend:
    post:
      tags: [admin]
      operationId: resendInvitation
      description: Mails a new link for a pending invitation; the previous link stops working.
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Not pending any more (code invitation_not_pending)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/webhooks:
    get:
      tags: [admin]
      operationId: listWebhooks
      security: [{ adminKey: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses:
        '200':
          description: The tenant's webhooks, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: '#/components/schemas/Webhook' }
        '400':
          description: No tenant named (code tenant_required)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: createWebhook
      description: |
        Registers an endpoint for the tenant's events. A value outside its
        range is refused (code invalid_request), never replaced; an omitted
        optional value takes its default.
      security: [{ adminKey: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, events]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                url:
                  type: string
                  description: |
                    An absolute http or https URL. A local or private address is
                    refused unless the deployment allows private targets.
                events:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/WebhookEvent' }
                enabled: { type: boolean, default: true }
                retry_count: { type: integer, minimum: 0, maximum: 10, default: 3 }
                timeout_secs: { type: integer, minimum: 1, maximum: 60, default: 30 }
      responses:
        '201':
          description: Created. The only answer that carries the signing secret.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, secret]
                properties:
                  webhook: { $ref: '#/components/schemas/Webhook' }
                  secret:
                    type: string
                    description: |
                      Signs every delivery (Standard Webhooks — see the `event`
                      webhook below): "whsec_" followed by the base64 of the key
                      bytes. Not shown again — rotate to replace it.
                    pattern: '^whsec_[A-Za-z0-9+/]+={0,2}$'
                  message: { type: string }
        '400':
          description: Invalid value (code invalid_request), or no tenant named (code tenant_required)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/events:
    get:
      tags: [admin]
      operationId: listWebhookEvents
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: What a webhook can subscribe to
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [type, description]
                      properties:
                        type: { $ref: '#/components/schemas/WebhookEvent' }
                        description: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getWebhook
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The webhook
          content:
            application/json:
              schema:
                type: object
                required: [webhook]
                properties:
                  webhook: { $ref: '#/components/schemas/Webhook' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [admin]
      operationId: updateWebhook
      description: Changes the fields the body names; the same ranges as creation apply.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                url: { type: string }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/WebhookEvent' }
                enabled: { type: boolean }
                retry_count: { type: integer, minimum: 0, maximum: 10 }
                timeout_secs: { type: integer, minimum: 1, maximum: 60 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [webhook]
                properties:
                  webhook: { $ref: '#/components/schemas/Webhook' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      operationId: deleteWebhook
      security: [{ adminKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/{id}/test:
    post:
      tags: [admin]
      operationId: testWebhook
      description: |
        Sends one test event to this webhook — enabled or not, whatever it
        subscribes to — and answers with the delivery. A receiver that refuses
        or cannot be reached still answers 200; the delivery says how it went.
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The delivery
          content:
            application/json:
              schema:
                type: object
                required: [delivery]
                properties:
                  delivery: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/{id}/rotate-secret:
    post:
      tags: [admin]
      operationId: rotateWebhookSecret
      description: Replaces the signing secret; the previous one stops signing at once.
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The new secret, shown this once
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret: { type: string, pattern: '^whsec_[A-Za-z0-9+/]+={0,2}$', description: 'Same form as the secret a webhook is created with.' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/{id}/deliveries:
    get:
      tags: [admin]
      operationId: listWebhookDeliveries
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Delivery attempts, newest first
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/audit/logs:
    get:
      tags: [admin]
      operationId: listAuditLogs
      description: |
        One page of the tenant's audit log, newest first. A filter that is not
        well formed is refused (code invalid_request), never ignored.
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: actor_id, in: query, required: false, schema: { type: string } }
        - { name: action, in: query, required: false, schema: { type: string }, description: One of GET /api/v1/audit/actions. }
        - { name: resource_type, in: query, required: false, schema: { type: string } }
        - { name: resource_id, in: query, required: false, schema: { type: string } }
        - { name: severity, in: query, required: false, schema: { $ref: '#/components/schemas/AuditSeverity' } }
        - { name: success, in: query, required: false, schema: { type: boolean } }
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of entries
          content:
            application/json:
              schema:
                type: object
                required: [logs, total, limit, offset]
                properties:
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400':
          description: A malformed filter (code invalid_request), or no tenant named (code tenant_required)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/audit/logs/{id}:
    get:
      tags: [admin]
      operationId: getAuditLog
      security: [{ adminKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                type: object
                required: [log]
                properties:
                  log: { $ref: '#/components/schemas/AuditLog' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/audit/logs/purge:
    delete:
      tags: [admin]
      operationId: purgeAuditLogs
      description: Deletes the tenant's entries older than retention_days.
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: retention_days, in: query, required: false, schema: { type: integer, minimum: 30, maximum: 36500, default: 90 } }
      responses:
        '200':
          description: Purged
          content:
            application/json:
              schema:
                type: object
                required: [deleted, retention_days]
                properties:
                  deleted: { type: integer, minimum: 0 }
                  retention_days: { type: integer }
                  message: { type: string }
        '400':
          description: retention_days out of range (code invalid_request), or no tenant named (code tenant_required)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/audit/users/{userId}/activity:
    get:
      tags: [admin]
      operationId: getUserAuditActivity
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: The user's most recent entries in the tenant
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/audit/security:
    get:
      tags: [admin]
      operationId: getSecurityAuditEvents
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: hours, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 168, default: 24 } }
      responses:
        '200':
          description: Warning-and-above entries from the last hours
          content:
            application/json:
              schema:
                type: object
                required: [logs, hours]
                properties:
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  hours: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/audit/summary:
    get:
      tags: [admin]
      operationId: getAuditSummary
      security: [{ adminKey: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses:
        '200':
          description: Entry counts over recent windows
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    type: object
                    required: [total_24h, total_7d, total_30d, security_events, failed_operations]
                    properties:
                      total_24h: { type: integer, minimum: 0 }
                      total_7d: { type: integer, minimum: 0 }
                      total_30d: { type: integer, minimum: 0 }
                      security_events: { type: integer, minimum: 0 }
                      failed_operations: { type: integer, minimum: 0, description: Entries in the last 24 hours recorded as failures. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/audit/actions:
    get:
      tags: [admin]
      operationId: listAuditActions
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The actions and severities an entry can carry
          content:
            application/json:
              schema:
                type: object
                required: [actions, severities]
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      required: [action, description]
                      properties:
                        action: { type: string }
                        description: { type: string }
                  severities:
                    type: array
                    items:
                      type: object
                      required: [severity, description]
                      properties:
                        severity: { $ref: '#/components/schemas/AuditSeverity' }
                        description: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/users:
    get:
      tags: [admin]
      operationId: listUsers
      security: [{ adminKey: [] }]
      parameters:
        - name: tenant_id
          in: query
          required: false
          description: The tenant whose users to list. The X-Tenant-ID header says the same; the query wins when both are given.
          schema: { type: string }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: A page of users — of the tenant the call names (X-Tenant-ID, or tenant_id), every tenant's when it names none
          content:
            application/json:
              schema:
                type: object
                required: [users, total, limit, offset]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getUser
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [admin]
      operationId: updateUser
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: An absent field leaves the stored value alone; an empty one clears it.
              properties:
                name: { type: string }
                avatar_url: { type: string }
                active:
                  description: |
                    false suspends the account: its sessions end (refresh
                    tokens stop working, applications registered for
                    back-channel logout are told) and signing in is refused
                    with `403 account_suspended` once the user has proved who
                    they are. true lifts the suspension. The account, its
                    connections and second factor are kept. Access tokens
                    already issued are refused at once by Authway's endpoints,
                    userinfo and introspection; only a resource server that
                    verifies a JWT itself accepts one until it expires. Sent as
                    `user.suspended` / `user.reactivated` events.
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        # The account is suspended but its sessions could not be ended (code
        # authorization_server_unavailable); the same request again ends them.
        '502': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      operationId: deleteUser
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/users/{id}/claims:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getUserClaims
      description: |
        The claims stored for the user. Offered when capabilities.custom_claims
        is true. A provider may also accept a credential scoped to the user's
        tenant; such a caller does not find users of other tenants (404).
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The stored claims
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredClaims' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [admin]
      operationId: patchUserClaims
      description: |
        Sets and removes claims stored for the user, as a JSON merge patch
        (RFC 7396) of `claims`: a value sets the claim, null removes it, a
        claim not named is left alone. The stored claims go into the tokens
        issued to the user from their next authorization on — at the top level
        of the ID token. Only a trusted party writes them; the user cannot.

        Refused as a whole, changing nothing: a claim the provider asserts or
        OAuth / OpenID Connect defines (`400 reserved_claim`, with `keys`), an
        empty or overlong name (`400 invalid_request`), or claims that would
        make the user's tokens too large (`413 claims_too_large`).
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claims]
              properties:
                claims:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: The claims stored afterwards
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredClaims' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }

  /api/v1/users/{id}/terms-acceptances:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: listTermsAcceptances
      description: |
        What the user accepted and when, most recent first — for an
        application that needs the record, not just the fact (a signed-in
        user has accepted the current documents). Offered when
        capabilities.terms_acceptance is true. A credential scoped to the
        user's tenant (admin.terms:write) does not find users of other
        tenants (404).
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The acceptances
          content:
            application/json:
              schema:
                type: object
                required: [acceptances]
                properties:
                  acceptances: { type: array, items: { $ref: '#/components/schemas/TermsAcceptance' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

webhooks:
  event:
    post:
      summary: A delivery of one event to a registered webhook
      description: |
        Signed as Standard Webhooks specifies (https://www.standardwebhooks.com),
        so any of its libraries verifies a delivery with the webhook's secret.
        The signed content is "<webhook-id>.<webhook-timestamp>.<raw body>";
        verify against the body exactly as received. A retry of the same event
        carries the same webhook-id (also the body's `id`) and a new timestamp
        and signature. A 2xx answer ends the retries; redirects are not
        followed.
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: The event's id — the same on every retry of it. Use it to ignore a delivery already processed.
          schema: { type: string }
        - name: webhook-timestamp
          in: header
          required: true
          description: Unix time, in seconds, this attempt was signed. Refuse one far from your clock (the reference libraries allow five minutes).
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: webhook-signature
          in: header
          required: true
          description: |
            Space-separated signatures, each "v1,<base64 HMAC-SHA256>". One
            that matches is enough.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEventPayload' }
      responses:
        '200':
          description: Any 2xx answer means delivered.

components:
  securitySchemes:
    adminKey:
      type: http
      scheme: bearer
      description: The deployment's admin API key, or an admin console session token.
    clientSecret:
      type: http
      scheme: basic
      description: A confidential client's id and secret (or the same two in the form, as client_id and client_secret).
    userToken:
      type: http
      scheme: bearer
      description: |
        An access token issued to the user by the authorization server. Its
        auth_time claim says when the user of the session it came from last
        signed in; a token refreshed later keeps that time. See TokenClaims.

  parameters:
    StrictSync:
      name: strict_sync
      in: query
      required: false
      description: |
        true: answer 502 when the change was saved but the authorization
        server rejected it. Otherwise the answer succeeds and sync_status
        reports the outcome.
      schema: { type: boolean }
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: false
      description: The tenant the call acts on. A tenant_id query parameter works too.
      schema: { type: string }
    Token:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    Flow:
      name: flow
      in: path
      required: true
      description: Opaque flow id, URL-encoded.
      schema: { type: string, minLength: 1 }

  requestBodies:
    SecondFactorCode:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                description: A current code from the user's authenticator, or — where proof of the factor is asked for — an unused recovery code.

    EmailAddress:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string }
              client_id: { type: string, description: Scopes the lookup to the client's tenant. }
    SecondFactor:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [mfa_challenge, code]
            properties:
              mfa_challenge: { type: string, description: Issued when the first factor passed; only valid for its own flow. }
              code: { type: string }
    MagicLinkToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }

  responses:
    Message:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
    Redirect:
      description: Continue in the browser
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Redirect' }
    SignedInOrTerms:
      description: Signed in, or the tenant's terms are owed
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Redirect'
              - $ref: '#/components/schemas/TermsRequired'
    TooManyRequests:
      description: Rate limited; retry_after is in seconds
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  retry_after: { type: integer, minimum: 0 }
    Error:
      description: Refused
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
    SyncFailed:
      description: |
        Saved, but the authorization server rejected the change (only with
        strict_sync=true; code upstream_sync_failed).
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [sync_status]
                properties:
                  sync_status: { $ref: '#/components/schemas/SyncStatus' }

  schemas:
    SecondFactorSetup:
      type: object
      required: [secret, otpauth_uri, qr_image, issuer, account_name]
      properties:
        secret: { type: string, minLength: 1, description: The TOTP secret (base32), for typing into an authenticator by hand. }
        otpauth_uri: { type: string, minLength: 1, description: 'The same secret as an `otpauth://` URI — show it as a QR code.' }
        qr_image: { type: string, pattern: '^data:image/png;base64,', description: 'otpauth_uri already drawn as a QR code — a data: URL of a PNG, for a screen without a QR encoder.' }
        issuer: { type: string }
        account_name: { type: string, description: The user's email address. }

    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, minItems: 1, items: { type: string } }
        message: { type: string }

    SecondFactorTurnedOn:
      allOf:
        - $ref: '#/components/schemas/RecoveryCodes'
        - type: object
          required: [sessions_ended]
          properties:
            sessions_ended:
              description: |
                What became of the user's sessions. `others`: every other
                session has ended and the token used here still works. `all`:
                every session has ended, this one too — the token did not say
                which session it came from; show the recovery codes from this
                answer, then have the user sign in again. `none`: the factor
                is on but the sessions could not be ended.
              enum: [others, all, none]

    SecondFactorStatus:
      type: object
      required: [enabled, recovery_codes_left]
      properties:
        enabled: { type: boolean }
        enabled_at: { type: string }
        recovery_codes_left: { type: integer, minimum: 0 }

    Redirect:
      type: object
      required: [next, redirect_to]
      properties:
        next: { const: redirect }
        redirect_to: { type: string, minLength: 1 }

    MFARequired:
      description: |
        The user proved who they are by one means and has a second factor: it
        is owed whichever means that was — a password, an emailed link,
        another identity provider. Answer it on the named flow.
      type: object
      required: [next, mfa_challenge, flow]
      properties:
        next: { const: mfa }
        mfa_challenge: { type: string, minLength: 1 }
        flow: { type: string, minLength: 1, description: The login flow the second factor belongs to. }

    TermsDocument:
      type: object
      required: [kind, version, url]
      properties:
        kind: { type: string, description: 'Which document, e.g. terms_of_service or privacy_policy.' }
        version: { type: string }
        url: { type: string, description: Where the application publishes it. }
        title: { type: string, description: What to call it on screen; absent means the screen names it from kind. }
        published_at: { type: string, description: When this version became current (admin answers only). }

    TermsRequired:
      description: |
        The user has proved who they are, second factor included, and has not
        accepted the current version of every document the tenant asks for.
        Show `terms` — each a link to the document — and answer with
        POST /api/v1/login-flows/{flow}/terms or …/terms/decline, quoting
        terms_challenge: it proves the earlier steps passed, as mfa_challenge
        does. A sign-in that reuses the browser's session can owe it too.
      type: object
      required: [next, flow, terms_challenge, terms]
      properties:
        next: { const: terms }
        flow: { type: string, minLength: 1 }
        terms_challenge: { type: string, minLength: 1 }
        terms:
          description: |
            Only the documents not yet accepted, ordered by kind. Empty only
            when what was owed was retired after the step began: accepting the
            empty list completes the sign-in.
          type: array
          items: { $ref: '#/components/schemas/TermsDocument' }

    TermsMismatch:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [terms]
          properties:
            code: { const: terms_mismatch }
            terms:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/TermsDocument' }

    TermsAcceptance:
      type: object
      required: [kind, version, accepted_at]
      properties:
        kind: { type: string }
        version: { type: string }
        accepted_at: { type: string }
        client_id: { type: string, description: The application the user was signing in to. }

    EmailSent:
      type: object
      required: [next]
      properties:
        next: { const: email_sent }

    LoginForm:
      type: object
      required: [next, flow, client_name, requested_scope, client]
      properties:
        next: { const: form }
        flow: { type: string }
        client_name: { type: string }
        client_logo_uri:
          description: The application's logo (its registered `logo`), to show with its name. Absent or empty when it has none.
          type: string
        requested_scope: { type: [array, 'null'], items: { type: string } }
        client:
          type: object
          required: [client_id, sign_in_methods]
          properties:
            client_id: { type: string }
            sign_in_methods:
              description: What to offer, in order — "email" for the password form, "magic_link", then social providers.
              type: array
              items: { type: string }
        hints:
          description: |
            What the application's authorization request asked of the sign-in
            screen, which only has the flow id. Every field is optional, and
            none decides anything: they are for the screen's convenience.
          type: object
          properties:
            sign_in_method:
              description: |
                The way of signing in to start with — the request's
                `connection` parameter, passed on only when it is one of
                client.sign_in_methods.
              type: string
            login_hint:
              description: The address the application expects to sign in (OpenID Connect `login_hint`).
              type: string
            ui_locales:
              description: The languages the application prefers, most preferred first (OpenID Connect `ui_locales`).
              type: array
              items: { type: string }

    ConsentForm:
      type: object
      required: [next, flow, client_name, requested_scope, user]
      properties:
        next: { const: form }
        flow: { type: string }
        client_name: { type: string }
        client_logo_uri:
          description: The application's logo (its registered `logo`), to show with its name. Absent or empty when it has none.
          type: string
        requested_scope: { type: [array, 'null'], items: { type: string } }
        user:
          type: object
          required: [email]
          properties:
            email: { type: string }
            name: { type: [string, 'null'] }

    MagicLinkInspection:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        email: { type: string }
        expires_at: { type: string }
        flow:
          type: string
          description: |
            The login flow the link signs in to. Only the browser that started
            that flow can finish it with the link — a page in another one
            shows the code to type there instead.
        detail: { type: string, description: Why the link cannot be used, when valid is false. }

    LogoutToken:
      description: |
        The claims of the `logout_token` POSTed to a client's
        `backchannel_logout_uri` when a session ends (OpenID Connect
        Back-Channel Logout 1.0). A receiver validates it as it would an ID
        token — signature against the issuer's keys, `iss`, `aud` — and then:

        - **How long it is good for.** By `exp` when the token has one.
          A token without `exp` is good for 5 minutes after `iat`; a receiver
          refuses an older one. The specification makes `exp` required, and
          an implementation whose engine issues it does so with a lifetime of
          at most those 5 minutes; an implementation whose engine does not
          issue it sends the token without, and this rule is what stands in
          for it. A receiver that follows the rule behaves the same against
          either.
        - **What it is.** `events` has the back-channel logout member, and
          there is no `nonce`: a logout token is never an ID token. The JOSE
          header's `typ` is not to be relied on to tell them apart.
        - **What it ends.** The session named by `sid` — the `sid` of the ID
          tokens issued on it. There is no `sub`.
      type: object
      required: [iss, aud, iat, jti, events, sid]
      not: { required: [nonce] }
      properties:
        iss: { type: string, description: The issuer. }
        aud:
          description: Contains the client the token is sent to.
          type: array
          items: { type: string }
          minItems: 1
        iat: { type: integer, description: When the token was issued, in seconds since the epoch. }
        exp: { type: integer, description: Absent or no later than 5 minutes after `iat` — see above. }
        jti: { type: string, description: Unique to the token. }
        sid: { type: string, description: The session that ended. }
        events:
          type: object
          required: ['http://schemas.openid.net/event/backchannel-logout']

    PasswordMinLengthInForce:
      description: |
        The least length of the password the screen is about to ask for: the
        tenant's password_min_length where it asks for more than every tenant
        gets, 8 otherwise. A shorter password is refused with code
        password_too_short when it is submitted; this lets the screen say so
        before that.
      type: integer
      minimum: 8
      maximum: 72

    Invitation:
      type: object
      required: [id, email, tenant_name, expires_at]
      properties:
        id: { type: string }
        email: { type: string }
        tenant_name: { type: string }
        inviter_name: { type: string }
        message: { type: string }
        expires_at: { type: string }
        client:
          $ref: '#/components/schemas/InvitationApp'

    InvitationApp:
      description: |
        The application an invitation is for. Once the invitation is accepted,
        a screen sends the user to `initiate_login_uri` with `iss` (the
        issuer) and `login_hint` (the address), where the application starts
        a sign-in (OpenID Connect Core 1.0 section 4) — or, without one, to
        `client_uri`.
      type: object
      required: [client_id, name]
      properties:
        client_id: { type: string }
        name: { type: string }
        initiate_login_uri: { type: string }
        client_uri: { type: string }

    AdminInvitation:
      type: object
      required: [id, tenant_id, email, status, expires_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        email: { type: string }
        status: { type: string, enum: [pending, accepted, expired, revoked] }
        message: { type: string }
        inviter_id: { type: ['null', string], description: null when issued with the admin key. }
        inviter_name: { type: string }
        tenant_name: { type: string }
        accepted_at: { type: ['null', string] }
        accepted_by: { type: ['null', string] }
        client:
          $ref: '#/components/schemas/InvitationApp'
        expires_at: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    TokenClaims:
      description: |
        The claims a provider adds to the tokens it issues, beyond those OAuth
        and OpenID Connect define. A JWT access token and the ID token carry
        them at the top level, so a resource server reads them with any JWT
        library and the same code works against every provider. (A provider
        may repeat them elsewhere in the token; only the top level is part of
        this contract.)

        **These are the claims the provider vouches for.** It asserts them
        itself, and no other source replaces them, nor any claim OAuth or
        OpenID Connect defines. Every other claim in a token is one the
        tenant's administrator or backend stored for the user
        (/api/v1/users/{id}/claims): the provider carries it and does not vouch
        for what it means. Roles and permissions are not among the provider's
        claims — what a user may do in an application is that application's
        decision.

        An application identifies a user by issuer and `sub`.
      type: object
      required: [sub, tenant_id, email, auth_time]
      properties:
        sub:
          type: string
          description: |
            The user's id. It does not change while the account exists and is
            never given to another account. Moving a user base to another
            deployment keeps each user's `sub`; the issuer is the
            deployment's own.
        tenant_id:
          type: string
          description: |
            The tenant the user belongs to. Always present: a provider with a
            single tenant carries that tenant's id.
        email: { type: string }
        name:
          type: ['null', string]
          description: |
            The user's display name, as one string. The provider carries no
            given_name, family_name or preferred_username.
        email_verified:
          type: boolean
          description: In the ID token, whether the provider verified the address.
        auth_time:
          type: integer
          description: |
            Unix time at which the user of the session the token came from
            last signed in. Refreshing the token, or reusing the session
            without signing in again, does not change it.
        sid:
          type: string
          description: |
            In the ID token, the session the token came from. Every ID token
            issued from one browser session carries the same `sid`, and a
            logout token names the session that ended by it — an application
            that keeps `sid` with its own session can end exactly that one.
        amr:
          type: array
          items: { type: string }
          description: |
            In the ID token, how the user of the session signed in
            (Authentication Method Reference values): `pwd` for a password,
            `otp` for a one-time code from an authenticator, `mfa` when more
            than one factor was used — the values of RFC 8176 — and, where it
            registers none, `email` for an emailed link and `fed` for another
            identity provider. Like auth_time it describes the sign-in, not
            the token: a reused session keeps it. Absent when the provider
            does not know how the session was authenticated. The provider
            issues no `acr`.

    JwtAccessToken:
      description: |
        **The resource server profile.** How an API that receives access
        tokens verifies them and reads who they are about, knowing only the
        provider's issuer — the same way for every provider.

        A client registered with `access_token_strategy: jwt` receives access
        tokens that are JWTs, signed and not encrypted. A resource server
        verifies one with a standard JOSE library: the keys at the `jwks_uri`
        of the issuer's OpenID Connect discovery document, the `iss` claim
        equal to the issuer, and its own identifier among `aud`. It needs no call to the provider and no
        knowledge of which authorization server issued the token.

        Such a token is valid until it expires: revoking the session or the
        account does not reach a token a resource server verifies offline.
        That is the choice the client makes by asking for JWTs; keep their
        lifetime short where that matters.

        Access tokens of other clients are opaque to everyone but the
        provider. Whether and how a resource server can ask the provider about
        one (token introspection) is not part of this contract.
      allOf:
        - $ref: '#/components/schemas/TokenClaims'
        - type: object
          required: [iss, sub, exp, iat, client_id, scope]
          properties:
            iss: { type: string, description: The issuer. }
            exp: { type: integer }
            iat: { type: integer }
            client_id: { type: string, description: The client the token was issued to. }
            scope:
              type: string
              description: The granted scopes, space-separated (RFC 9068).
            aud:
              description: |
                The resource servers the token is for: those the client is
                registered for (`audience` of the client), or the ones among
                them the authorization request named. A resource server
                accepts a token only when `aud` contains its own identifier;
                it is empty for a client registered for none.
              type: array
              items: { type: string }

    StoredClaims:
      type: object
      required: [claims]
      properties:
        claims:
          type: object
          additionalProperties: true

    ServiceClient:
      type: object
      required: [id, tenant_id, hydra_client_id, name, granted_scopes, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        hydra_client_id: { type: string, description: The client_id the credential gets tokens with. }
        name: { type: string }
        granted_scopes: { type: array, items: { type: string } }
        revoked_at: { type: ['null', string] }
        created_at: { type: string }

    OwnProfile:
      type: object
      required: [id, email, email_verified]
      properties:
        id: { type: string, description: The user's id — the sub of their tokens. }
        email: { type: string }
        name: { type: ['null', string] }
        email_verified: { type: boolean }
        has_password:
          type: boolean
          description: Whether the account has a password — one that signs in only by link or by another provider has none.
        created_at: { type: string }
        updated_at: { type: string }

    Webhook:
      type: object
      required: [id, tenant_id, name, url, events, enabled, retry_count, timeout_secs, created_at, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        url: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEvent' }
        enabled: { type: boolean }
        retry_count: { type: integer, minimum: 0, maximum: 10, description: Attempts after the first. }
        timeout_secs: { type: integer, minimum: 1, maximum: 60 }
        created_at: { type: string }
        updated_at: { type: string }

    WebhookEvent:
      description: |
        What a webhook can subscribe to. Every event listed is sent; a provider
        lists only the events it sends.
      type: string
      enum: [user.created, user.updated, user.deleted, user.login, user.logout, user.password_changed,
             user.mfa_enabled, user.mfa_disabled, user.suspended, user.reactivated,
             client.created, client.updated, client.deleted, test, '*']

    WebhookEventPayload:
      description: |
        The JSON body of a delivery. `id` is unique per event and the same on
        every retry of it. `data` names what the event is about and who caused
        it, and nothing more — a receiver that needs the details asks the
        admin API for them. A `test` event's `data` is unspecified.
      type: object
      required: [id, type, timestamp, tenant_id, data]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/WebhookEvent' }
        timestamp: { type: string, format: date-time }
        tenant_id: { type: string }
        data:
          type: object
          properties:
            resource: { $ref: '#/components/schemas/WebhookEventRef' }
            actor: { $ref: '#/components/schemas/WebhookEventRef' }

    WebhookEventRef:
      description: |
        A resource or an actor. `id` is the id the admin API uses for it; it is
        absent for an actor without one (the system, or the deployment's key).
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: |
            For a resource, user or client. For an actor, the audit log's
            actor_type: user, api_key, admin_session, service_client or system.
        id: { type: string }

    WebhookDelivery:
      type: object
      required: [id, webhook_id, event_type, payload, status_code, attempt, delivered_at, success]
      properties:
        id: { type: string }
        webhook_id: { type: string }
        event_type: { type: string }
        payload: { type: string, description: The JSON body that was sent. }
        status_code: { type: integer, description: 0 when no answer arrived. }
        response_body: { type: string }
        attempt: { type: integer, minimum: 1 }
        delivered_at: { type: string }
        success: { type: boolean }
        error_message: { type: string }

    AuditLog:
      type: object
      required: [id, tenant_id, actor_id, actor_type, action, severity, success, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        actor_id: { type: ['null', string] }
        actor_email: { type: string }
        actor_type: { type: string }
        action: { type: string }
        severity: { $ref: '#/components/schemas/AuditSeverity' }
        resource_type: { type: string }
        resource_id: { type: string }
        ip_address: { type: string }
        user_agent: { type: string }
        details: { type: string, description: JSON text recorded with the event. }
        success: { type: boolean }
        error_msg: { type: string, description: Why the action failed; empty on success. }
        created_at: { type: string }

    AuditSeverity:
      type: string
      enum: [info, warning, error, critical]

    Tenant:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        settings: { $ref: '#/components/schemas/TenantSettings' }
        logo: { type: string }
        primary_color: { type: string }
        active: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }

    TenantSettings:
      type: object
      properties:
        password_min_length:
          description: |
            The least length of a password a user of the tenant may set, when
            the tenant asks for more than the 8 characters every tenant gets.
            0 or absent asks for no more. It applies wherever a password is
            set — accepting an invitation, resetting a password — and a
            shorter one is refused with code password_too_short and the
            length in force in min_length.
          type: integer
          anyOf:
            - const: 0
            - { minimum: 8, maximum: 72 }
        session_timeout:
          description: |
            Minutes a sign-in session of the tenant's users lasts, counted
            from the sign-in. 60 when absent or zero. A user who asks to stay
            signed in gets the deployment's longer session instead.
          type: integer
          minimum: 0
          maximum: 43200
        allowed_domains:
          description: |
            The email domains an account of the tenant can be created for.
            Empty or absent allows any. When it names domains, an invitation
            to an address outside them is refused (email_domain_not_allowed)
            and a first sign-in from one creates no account, open signup or
            not. A domain matches exactly — a subdomain is a different
            domain. Accounts that already exist are not affected.
          type: [array, 'null']
          items: { type: string }
        signup_mode:
          description: |
            open lets a first sign-in through a social provider or a sign-in
            link create the account; anything else (including empty) means
            invite_only.
          type: string

    User:
      type: object
      required: [id, tenant_id, email]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        email: { type: string }
        name: { type: string }
        avatar_url: { type: string }
        email_verified: { type: boolean }
        active: { type: boolean, description: false while an administrator has suspended the account. }
        connections:
          description: The sign-in providers the account is linked to (google, github, microsoft, apple) — empty for one that signs in only by password or emailed link.
          type: array
          items: { type: string }
        totp_enabled: { type: boolean }
        last_login_at: { type: ['null', string] }
        created_at: { type: string }
        updated_at: { type: string }

    ClientKeySet:
      description: |
        The public keys of a client that authenticates with a key
        (`token_endpoint_auth_method: private_key_jwt`): a JSON Web Key Set of
        1 to 10 RSA, EC or OKP keys. A private key is refused
        (`invalid_jwks`) — and, having been sent, is to be considered
        disclosed.
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [kty]
            properties:
              kty: { type: string, enum: [RSA, EC, OKP] }
              kid: { type: string }
              use: { type: string }
              alg: { type: string }

    Client:
      type: object
      required: [id, tenant_id, client_id, name, public, grant_types, scopes, token_endpoint_auth_method, system]
      properties:
        system:
          type: boolean
          description: |
            Part of Authway: the tenant's account screen client, registered the
            first time a user of the tenant opens that screen. It cannot be
            changed or deleted (code system_client); it goes with the tenant.
        id: { type: string, description: Authway's id for the registration (admin API paths). }
        tenant_id: { type: string }
        client_id: { type: string, description: The OAuth client_id. }
        name: { type: string }
        public: { type: boolean }
        redirect_uris: { type: [array, 'null'], items: { type: string } }
        post_logout_redirect_uris: { type: [array, 'null'], items: { type: string } }
        token_endpoint_auth_method:
          description: How the client authenticates at the token endpoint.
          type: string
          enum: [client_secret_post, private_key_jwt, none]
        jwks: { $ref: '#/components/schemas/ClientKeySet' }
        jwks_uri: { type: string, description: Where the client's key set is fetched, when it is not registered as `jwks`. }
        audience:
          description: The resource servers this client's access tokens are for (their `aud` claim).
          type: array
          items: { type: string }
        initiate_login_uri:
          description: Where the application starts a sign-in when asked to (OpenID Connect Core 1.0 section 4). Empty when none is registered.
          type: string
        client_uri:
          description: The application's home page. Empty when none is registered.
          type: string
        logo:
          description: The application's logo, shown on the sign-in and consent screens. Empty when none is registered.
          type: string
        google_oauth_enabled: { type: boolean, description: The application signs in to Google with its own app (its credentials are not returned). }
        google_redirect_uri: { type: [string, 'null'] }
        github_oauth_enabled: { type: boolean }
        microsoft_oauth_enabled: { type: boolean }
        microsoft_tenant_id: { type: [string, 'null'] }
        apple_oauth_enabled: { type: boolean }
        backchannel_logout_uri:
          description: |
            Where the client's backend is told that a user's session has ended.
            Empty when it is not told. The provider calls it from its own
            network, so it accepts only an address it may call on a client's
            say-so: a deployment decides how far that goes (a public https
            address by default), and none accepts an address that is no one's
            server, such as a link-local one (`invalid_backchannel_logout_uri`).
          type: string
        allowed_origins: { type: [array, 'null'], items: { type: string } }
        grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token, client_credentials, 'urn:ietf:params:oauth:grant-type:device_code'] } }
        scopes: { type: array, items: { type: string } }
        enabled_auth_providers: { type: [array, 'null'], items: { type: string } }
        active: { type: boolean, description: false while an administrator has turned the client off (see updateClient). }
        skip_consent: { type: boolean }
        skip_logout_consent: { type: boolean }
        access_token_strategy:
          description: |
            null when the client follows the deployment default. jwt: the
            resource server profile (JwtAccessToken).
          type: ['null', string]
          enum: [null, jwt, opaque]

    SyncStatus:
      type: object
      description: Whether the authorization server accepted the change.
      required: [state]
      properties:
        state: { type: string, enum: [ok, failed, skipped] }
        error: { type: string }

    Capabilities:
      type: object
      required: [multi_tenant, providers, magic_link, mfa, signup_modes, account_deletion, custom_claims, backchannel_logout, token_introspection, device_authorization, terms_acceptance, token_exchange, ciba]
      properties:
        multi_tenant: { type: boolean }
        providers:
          description: Social providers this deployment has credentials for.
          type: array
          items: { type: string }
        magic_link: { type: boolean }
        mfa: { type: array, items: { type: string } }
        signup_modes: { type: array, items: { type: string } }
        account_deletion:
          description: A signed-in user can delete their own account (DELETE /api/v1/profile/me).
          type: boolean
        custom_claims:
          description: Claims an administrator stores for a user go into the user's tokens (/api/v1/users/{id}/claims).
          type: boolean
        backchannel_logout:
          description: |
            A client that registers `backchannel_logout_uri` is told there
            when a user's session ends, however it ends: the user signs out
            from any application, signs out everywhere, resets their password
            or deletes their account.
          type: boolean
        token_introspection:
          description: A confidential client can ask whether a token of its tenant is still good (POST /api/v1/oauth2/introspect).
          type: boolean
        device_authorization:
          description: |
            A device signs in with a code the user enters on another screen
            (RFC 8628): discovery's `device_authorization_endpoint`, clients
            registered with the `urn:ietf:params:oauth:grant-type:device_code`
            grant, and POST /api/v1/device-flows/{flow} behind the login UI's
            device page.
          type: boolean
        terms_acceptance:
          description: |
            A tenant can name documents its users accept at sign-in, version by
            version (/api/v1/tenants/{id}/terms); a login flow then owes the
            terms step (TermsRequired) until the user has accepted the current
            versions.
          type: boolean
        token_exchange: { type: boolean }
        ciba: { type: boolean }

    Introspection:
      description: |
        RFC 7662. An inactive token carries `active: false` and nothing else.
        An active one carries what a JWT access token of the contract carries
        at its top level (see TokenClaims), whichever format the token has.
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        client_id: { type: string }
        sub: { type: string }
        scope: { type: string, description: Space-separated. }
        token_type: { type: string }
        token_use: { type: string }
        iss: { type: string }
        aud: { type: array, items: { type: string } }
        exp: { type: integer }
        iat: { type: integer }
        nbf: { type: integer }
        tenant_id: { type: string }
        email: { type: string }
        name: { type: ['null', string] }
        auth_time: { type: integer }
        ext:
          description: Claims stored for the user by an administrator or a service credential.
          type: object

    OAuthError:
      description: An OAuth 2.0 error (RFC 6749 §5.2).
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }

    Error:
      description: |
        Every refusal: RFC 9457 problem details (`application/problem+json`),
        in the form the *way family shares — `type` is `about:blank`, `title`
        the status's reason phrase, `detail` a message for a person, and `code`
        an extension member a caller branches on. Some refusals carry further
        extension members (`field`, `hint`, `retry_after`, …), named where they
        occur. A 401 carries `WWW-Authenticate`, a 429 `Retry-After`.
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { const: about:blank }
        title: { type: string, description: The HTTP status's reason phrase. }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: A message to show the user. }
        code:
          type: string
          description: |
            Stable identifier, for example invalid_flow, flow_expired,
            invalid_credentials, account_suspended, sign_in_method_not_allowed,
            invalid_mfa_challenge, invalid_code, mfa_locked, invalid_link,
            invalid_request, client_not_registered, invalid_token,
            token_expired, invitation_not_acceptable, invitation_not_accepted,
            too_many_requests, not_found, method_not_allowed, unauthorized,
            forbidden, insufficient_scope, admin_api_not_configured, conflict,
            public_client_has_no_secret, upstream_sync_failed,
            tenant_slug_taken, default_tenant_protected, tenant_has_users,
            tenant_has_clients, tenant_has_service_clients, tenant_required,
            user_already_member, invitation_already_pending,
            invitation_not_pending, email_domain_not_allowed,
            password_too_short, password_too_long, system_client,
            unknown_client, account_unavailable, invalid_current_password,
            insufficient_user_authentication, not_connected,
            last_sign_in_method, invalid_scope, internal_error,
            invalid_enabled_auth_providers, client_id_taken,
            internal_server_error. A refusal that carries only an HTTP status
            uses the code named after it.
        field:
          type: string
          description: |
            The request member at fault, when there is one: a member inside an
            object by its path (`settings.allowed_domains`), and a list by its
            own name — not an element's index. An admin API refusal that judges
            one member of the body carries it, so a form can show it at that input.
        hint: { type: string, description: What to do about it, when there is something. }
