# Traefik Dynamic Configuration for Authway
# Purpose: Dynamic CORS middleware for OAuth 2.0 token endpoint

http:
  # Services
  services:
    hydra-public:
      loadBalancer:
        servers:
          - url: "http://hydra:4444"
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    authway-api:
      loadBalancer:
        servers:
          - url: "http://authway-api:8080"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

  # Middlewares
  middlewares:
    # Security Headers
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true

    # Rate Limiting for token endpoint
    rate-limit-token:
      rateLimit:
        average: 10
        burst: 20
        period: 1s

    # Dynamic CORS for token endpoint
    # This will be handled by a Traefik plugin or custom middleware
    # For now, we use basicAuth as placeholder - will be replaced with dynamic CORS plugin
    cors-token-endpoint:
      headers:
        accessControlAllowOriginList:
          - "*"  # Temporarily allow all - will be replaced by dynamic validation
        accessControlAllowMethods:
          - "POST"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
        accessControlMaxAge: 3600
        addVaryHeader: true

  # Routers
  routers:
    # Hydra Token Endpoint (CORS-enabled)
    hydra-token:
      rule: "Host(`oauth.authway.in`) && Path(`/oauth2/token`)"
      entryPoints:
        - websecure
      middlewares:
        - cors-token-endpoint
        - rate-limit-token
      service: hydra-public
      tls:
        certResolver: letsencrypt

    # Hydra Authorization Endpoint
    hydra-auth:
      rule: "Host(`oauth.authway.in`) && PathPrefix(`/oauth2/auth`)"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
      service: hydra-public
      tls:
        certResolver: letsencrypt

    # Hydra Public API (all other endpoints)
    hydra-public:
      rule: "Host(`oauth.authway.in`)"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
      service: hydra-public
      tls:
        certResolver: letsencrypt

    # Authway API
    authway-api-router:
      rule: "Host(`auth.authway.in`) || Host(`api.authway.in`)"
      entryPoints:
        - websecure
      middlewares:
        - security-headers
      service: authway-api
      tls:
        certResolver: letsencrypt

# TCP Services (if needed for admin API)
tcp:
  routers:
    hydra-admin:
      rule: "HostSNI(`*`)"
      entryPoints:
        - admin
      service: hydra-admin-tcp

  services:
    hydra-admin-tcp:
      loadBalancer:
        servers:
          - address: "hydra:4445"
