# Docker Compose configuration for Traefik Reverse Proxy
# Purpose: Add OAuth 2.0 compliant dynamic CORS support to Authway
# Usage: docker-compose -f docker-compose.yml -f docker-compose.proxy.yml up -d

version: '3.8'

services:
  # Traefik Reverse Proxy with Dynamic CORS
  traefik:
    image: traefik:v2.10
    container_name: authway-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./configs/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik-dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - traefik-certs:/letsencrypt
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=authway
      - POSTGRES_PASSWORD=authway
      - POSTGRES_DB=authway
    networks:
      - authway-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Dashboard
      - "traefik.http.routers.dashboard.rule=Host(`traefik.authway.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"

  # Update Hydra to not expose ports directly (accessed via Traefik)
  hydra:
    labels:
      - "traefik.enable=true"
      # Public API
      - "traefik.http.routers.hydra-public.rule=Host(`oauth.authway.local`)"
      - "traefik.http.routers.hydra-public.entrypoints=web"
      - "traefik.http.services.hydra-public.loadbalancer.server.port=4444"
      # Token endpoint with dynamic CORS
      - "traefik.http.routers.hydra-token.rule=Host(`oauth.authway.local`) && Path(`/oauth2/token`)"
      - "traefik.http.routers.hydra-token.entrypoints=web"
      - "traefik.http.routers.hydra-token.middlewares=cors-dynamic"
    # Remove port mappings (accessed via Traefik)
    ports: []

  # Update Authway API to be accessed via Traefik
  authway-api:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authway-api.rule=Host(`auth.authway.local`) || Host(`api.authway.local`)"
      - "traefik.http.routers.authway-api.entrypoints=web"
      - "traefik.http.services.authway-api.loadbalancer.server.port=8080"
    ports: []

  # Update frontend services
  login-ui:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.login-ui.rule=Host(`login.authway.local`)"
      - "traefik.http.routers.login-ui.entrypoints=web"
      - "traefik.http.services.login-ui.loadbalancer.server.port=3001"
    ports: []

  admin-dashboard:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-dashboard.rule=Host(`admin.authway.local`)"
      - "traefik.http.routers.admin-dashboard.entrypoints=web"
      - "traefik.http.services.admin-dashboard.loadbalancer.server.port=3000"
    ports: []

volumes:
  traefik-certs:
    driver: local

networks:
  authway-network:
    external: true
