<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      margin: 0 auto 1rem;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
    }
    p {
      margin: 0;
      opacity: 0.9;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>Authentication Successful!</h2>
    <p>Completing popup login...</p>
  </div>

  <script>
    /**
     * Popup Callback Handler
     *
     * This page is loaded in the popup window after OAuth redirect.
     * It sends the authorization code back to the parent window via postMessage,
     * allowing the SDK to complete authentication without Cross-Origin issues.
     */
    (function() {
      try {
        // Check if this is running in a popup window
        if (!window.opener) {
          console.error('No window.opener found - not in popup mode')
          document.body.innerHTML = '<div class="container"><h2>⚠️ Error</h2><p>This page should be opened in a popup window</p></div>'
          return
        }

        console.log('🔐 Popup Callback: Processing authentication...')
        console.log('Full URL:', window.location.href)
        console.log('Search params:', window.location.search)
        console.log('Hash:', window.location.hash)

        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search)
        const code = urlParams.get('code')
        const state = urlParams.get('state')
        const error = urlParams.get('error')
        const error_description = urlParams.get('error_description')

        console.log('Parsed params:', {
          code: code ? `${code.substring(0, 10)}...` : null,
          state: state ? `${state.substring(0, 10)}...` : null,
          error,
          error_description
        })

        // Send the OAuth parameters to the parent window via postMessage
        // The SDK expects code and state directly in the message
        window.opener.postMessage({
          type: 'authway-callback',
          code: code,
          state: state,
          error: error,
          error_description: error_description
        }, window.location.origin)

        console.log('✅ Sent callback URL to parent window')

        // Close the popup after a short delay
        setTimeout(() => {
          window.close()
        }, 1000)

      } catch (error) {
        console.error('❌ Popup callback error:', error)
        document.body.innerHTML = `
          <div class="container">
            <h2>⚠️ Error</h2>
            <p>${error.message}</p>
          </div>
        `
      }
    })()
  </script>
</body>
</html>
