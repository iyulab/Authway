<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Authentication Callback - v0.1.4</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>인증 완료</h2>
    <p>잠시만 기다려주세요... (v0.1.4)</p>
  </div>

  <script>
    (function() {
      console.log('[callback.html] VERSION: v0.1.4-iframe-fix'); // Version marker

      try {
        // Check if running inside an iframe
        const isInIframe = window.self !== window.top;

        console.log('[callback.html] Context check:', {
          isInIframe,
          hasOpener: !!window.opener,
          self: window.self === window,
          top: window.top === window
        });

        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        const error_description = urlParams.get('error_description');

        if (isInIframe) {
          // Running inside hidden iframe (ConsentPage/LoginPage popup flow)
          // Send postMessage to parent window (ConsentPage)
          console.log('[callback.html] ✅ Running in iframe - sending postMessage to parent');
          window.parent.postMessage({
            type: 'authway-callback',
            code: code,
            state: state,
            error: error,
            error_description: error_description
          }, '*'); // ConsentPage will validate origin
          return;
        }

        // Send message to parent window (opener)
        if (window.opener) {
          console.log('[callback.html] Popup mode - sending code to opener');
          window.opener.postMessage({
            type: 'authway-callback',
            code: code,
            state: state,
            error: error,
            error_description: error_description
          }, window.location.origin);

          // Close popup after sending message
          setTimeout(() => {
            window.close();
          }, 500);
        } else {
          console.log('[callback.html] No window.opener found - not in popup mode');
          // Not in popup mode, redirect to main app
          window.location.href = '/';
        }
      } catch (e) {
        console.error('Callback error:', e);
        // Fallback: redirect to main app
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      }
    })();
  </script>
</body>
</html>
