version: 2

updates:
  # Root Go module (includes apps/central/api — no go.work, but the module
  # itself is rooted here).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pnpm workspace: packages/client, packages/react, samples/*.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      workspace-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The two UI apps (apps/central/admin, apps/branding/auth-ui) keep their own
  # package-lock.json — npm, outside the pnpm workspace — but share most of
  # their dependencies and must stay on the same versions of them. Updating
  # them from one entry makes every group a single pull request spanning both
  # apps, so a bump can never land in one app and not the other.
  - package-ecosystem: "npm"
    directories:
      - "/apps/central/admin"
      - "/apps/branding/auth-ui"
    schedule:
      interval: "weekly"
    groups:
      ui-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Majors arrive together as well: they are applied and verified locally
      # as one batch (build, tests, lint per app) rather than merged one PR at
      # a time, where intermediate states that only work as a pair break.
      ui-major-dependencies:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
