name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build / vet / test
    runs-on: ubuntu-latest

    # The persistence tests need a real Postgres: the constraints they guard
    # (`redirect_uris text[] NOT NULL`, CHECK constraints, array types) and the
    # schema the migrations actually produce exist nowhere else. They are gated
    # on MIGRATE_SMOKE_DSN and would silently SKIP without this service.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: authway
          POSTGRES_USER: authway
          POSTGRES_PASSWORD: authway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authway -d authway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The service-client tests drive the real Hydra admin API: provisioning a
      # scoped credential registers an OAuth2 client there, and revoking it
      # deletes that client. A stub would verify nothing about the pairing that
      # actually breaks in production, so the test talks to a real Hydra —
      # the same version prod runs. `DSN=memory` keeps it to a single container
      # with no migration step (it is ready in about a second).
      #
      # `services:` cannot express this: Hydra needs `serve all --dev` as its
      # command, and a service container takes only an image and env.
      - name: Start Hydra (admin API for the service-client tests)
        run: |
          set -euo pipefail
          docker run -d --name hydra-ci --network host \
            --env-file configs/hydra.shared.env \
            -e DSN=memory \
            -e SECRETS_SYSTEM="$(openssl rand -hex 16)" \
            -e URLS_SELF_ISSUER=http://localhost:4444 \
            oryd/hydra:v26.2.0 serve all --dev
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:4445/health/ready >/dev/null; then
              echo "Hydra admin API ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Hydra admin API never became ready"
          docker logs hydra-ci
          exit 1

      - name: Test (central API)
        # Each migration test creates and drops its own throwaway database on
        # this server, so the DSN's own database is only used by the client
        # persistence tests, which bring the schema up via the real migrator.
        env:
          MIGRATE_SMOKE_DSN: postgres://authway:authway@localhost:5432/authway?sslmode=disable
          HYDRA_ADMIN_URL: http://localhost:4445
        run: go test ./apps/central/api/...

      # Fails the build if the Postgres-gated tests silently stop running — a
      # skip here looks identical to a pass in the summary above. The
      # service-client tests are listed too: they are gated on the same DSN but
      # additionally need Hydra, so dropping the Hydra step above would put them
      # right back in that blind spot.
      - name: Verify Postgres-gated tests actually ran
        env:
          MIGRATE_SMOKE_DSN: postgres://authway:authway@localhost:5432/authway?sslmode=disable
          HYDRA_ADMIN_URL: http://localhost:4445
        run: |
          set -euo pipefail
          out="$(go test -v -count=1 \
            -run 'TestMigrateFreshDatabase|TestInitialSchemaIsIdempotentOnPopulatedDatabase|TestCreateClient_MachineToMachine_PersistsEmptyRedirectURIs|TestCreate_RegistersInHydraAndDB|TestRevoke_SetsRevokedAtAndDeletesHydraClient' \
            ./apps/central/api/internal/database/ ./apps/central/api/pkg/client/ ./apps/central/api/pkg/serviceclient/)"
          echo "$out"
          for name in TestMigrateFreshDatabase \
                      TestInitialSchemaIsIdempotentOnPopulatedDatabase \
                      TestCreateClient_MachineToMachine_PersistsEmptyRedirectURIs \
                      TestCreate_RegistersInHydraAndDB \
                      TestRevoke_SetsRevokedAtAndDeletesHydraClient; do
            if ! grep -q "^--- PASS: $name" <<<"$out"; then
              echo "::error::$name did not run against Postgres (skipped or failed)"
              exit 1
            fi
          done

  # Black-box conformance scenarios (packages/conformance) against a real
  # stack: the API built from this commit, Hydra, Postgres, Redis and an SMTP
  # capture service. They drive the public surfaces only — the same scenarios
  # any Authway implementation has to pass.
  conformance:
    name: Conformance scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: authway
          POSTGRES_USER: authway
          POSTGRES_PASSWORD: authway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authway -d authway"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      ADMIN_API_KEY: ci-conformance-admin-key
      # The key Hydra presents when it calls the API's token hook.
      TOKEN_HOOK_KEY: ci-conformance-token-hook-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      # The native sign-in clients (clients/) are driven end to end by the
      # suite: each example signs in through its loopback port, refreshes and
      # signs out against the stack below.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('clients/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build the native sign-in examples
        run: |
          set -euo pipefail
          (cd clients/rust && cargo build --example sign_in --locked)
          dotnet build clients/csharp/examples/SignIn --nologo

      - name: Start Hydra
        run: |
          set -euo pipefail
          docker run -d --name hydra-ci --network host \
            --env-file configs/hydra.shared.env \
            -e DSN=memory \
            -e SECRETS_SYSTEM="$(openssl rand -hex 16)" \
            -e URLS_SELF_ISSUER=http://localhost:4444 \
            -e URLS_LOGIN=http://localhost:8080/flows/login \
            -e URLS_CONSENT=http://localhost:8080/flows/consent \
            -e URLS_LOGOUT=http://localhost:8080/flows/logout \
            -e URLS_DEVICE_VERIFICATION=http://localhost:8080/flows/device \
            -e URLS_DEVICE_SUCCESS=http://localhost:3001/device/done \
            -e WEBFINGER_OIDC_DISCOVERY_TOKEN_URL=http://localhost:8080/oauth2/token \
            -e OAUTH2_TOKEN_HOOK_URL=http://localhost:8080/internal/token-hook \
            -e OAUTH2_TOKEN_HOOK_AUTH_TYPE=api_key \
            -e OAUTH2_TOKEN_HOOK_AUTH_CONFIG_NAME=X-Authway-Hook-Key \
            -e OAUTH2_TOKEN_HOOK_AUTH_CONFIG_IN=header \
            -e OAUTH2_TOKEN_HOOK_AUTH_CONFIG_VALUE="$TOKEN_HOOK_KEY" \
            -e CLIENTS_HTTP_DISALLOW_PRIVATE_IP_RANGES=false \
            oryd/hydra:v26.2.0 serve all --dev
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4445/health/ready >/dev/null && exit 0
            sleep 1
          done
          echo "::error::Hydra never became ready"
          docker logs hydra-ci
          exit 1

      - name: Start the API
        env:
          AUTHWAY_DATABASE_HOST: localhost
          AUTHWAY_DATABASE_PORT: '5432'
          AUTHWAY_DATABASE_USER: authway
          AUTHWAY_DATABASE_PASSWORD: authway
          AUTHWAY_DATABASE_NAME: authway
          AUTHWAY_REDIS_HOST: localhost
          AUTHWAY_REDIS_PORT: '6379'
          AUTHWAY_EMAIL_SMTP_HOST: localhost
          AUTHWAY_EMAIL_SMTP_PORT: '1025'
          AUTHWAY_ADMIN_API_KEY: ${{ env.ADMIN_API_KEY }}
          AUTHWAY_HYDRA_TOKEN_HOOK_KEY: ${{ env.TOKEN_HOOK_KEY }}
          # The suite's back-channel logout receiver listens on this machine.
          AUTHWAY_ALLOW_PRIVATE_TARGETS: 'true'
          # Sign-in through Google is pointed at the stand-in provider the
          # conformance suite serves (packages/conformance/README.md).
          AUTHWAY_GOOGLE_ENABLED: 'true'
          AUTHWAY_GOOGLE_CLIENT_ID: standin
          AUTHWAY_GOOGLE_CLIENT_SECRET: standin
          AUTHWAY_GOOGLE_AUTH_URL: http://localhost:9912/authorize
          AUTHWAY_GOOGLE_TOKEN_URL: http://localhost:9912/token
          AUTHWAY_GOOGLE_USERINFO_URL: http://localhost:9912/userinfo
          # Console accounts sign in through the console's own client; nothing
          # listens there — the suite takes the code from the redirect.
          AUTHWAY_APP_CONSOLE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/authway-api" ./apps/central/api/cmd
          (cd "$RUNNER_TEMP" && nohup ./authway-api > api.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::The API never became healthy"
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Run conformance scenarios
        env:
          CONFORMANCE_ISSUER: http://localhost:4444
          CONFORMANCE_API: http://localhost:8080
          CONFORMANCE_ADMIN_KEY: ${{ env.ADMIN_API_KEY }}
          CONFORMANCE_MAIL_API: http://localhost:8025
          CONFORMANCE_IDP_STANDIN: http://localhost:9912
          CONFORMANCE_CONSOLE_URL: http://localhost:3000
          CONFORMANCE_NATIVE_CLIENTS: >-
            rust=${{ github.workspace }}/clients/rust/target/debug/examples/sign_in;
            dotnet=dotnet ${{ github.workspace }}/clients/csharp/examples/SignIn/bin/Debug/net10.0/SignIn.dll
        run: pnpm --filter @authway/conformance test

      - name: Show service logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/api.log" || true
          docker logs hydra-ci || true

  # The on-premises bundle (deploy/onprem) as an installation runs it: both
  # images built from this commit, setup.sh, one `docker compose up`, then
  # sign-in scenarios against the one origin through its own certificate
  # authority. Nothing else in CI starts the images, the front's routing or the
  # production-mode configuration checks.
  onprem:
    name: On-premises bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build the images and the bundle
        run: |
          set -euo pipefail
          docker build -t authway-api:latest --build-arg APP_VERSION=ci-${{ github.sha }} .
          docker build -t authway-web:latest -f deploy/onprem/web.Dockerfile .
          sh deploy/onprem/pack.sh "$RUNNER_TEMP/bundle" --no-images

      - name: Install
        working-directory: ${{ runner.temp }}/bundle
        run: |
          set -euo pipefail
          sh setup.sh
          # auth.localtest.me resolves to 127.0.0.1; the API refuses a loopback
          # name for its public address in production mode.
          sed -i -e 's|^AUTHWAY_DOMAIN=.*|AUTHWAY_DOMAIN=auth.localtest.me:8443|' \
                 -e 's|^#AUTHWAY_HTTPS_PORT=443|AUTHWAY_HTTPS_PORT=8443|' \
                 -e 's|^AUTHWAY_EMAIL_SMTP_HOST=.*|AUTHWAY_EMAIL_SMTP_HOST=mailhog|' \
                 -e 's|^AUTHWAY_EMAIL_SMTP_PORT=.*|AUTHWAY_EMAIL_SMTP_PORT=1025|' \
                 -e 's|^AUTHWAY_EMAIL_SMTP_SECURITY=.*|AUTHWAY_EMAIL_SMTP_SECURITY=none|' \
                 -e 's|^AUTHWAY_EMAIL_FROM_EMAIL=.*|AUTHWAY_EMAIL_FROM_EMAIL=noreply@example.com|' .env
          # A mail catcher in place of the organization's SMTP server.
          printf 'services:\n  mailhog:\n    image: mailhog/mailhog:latest\n    ports: ["8025:8025"]\n' > mail.yml
          docker compose -f docker-compose.yml -f mail.yml up -d --wait --wait-timeout 300
          docker compose cp web:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/root.crt"
          key=$(grep '^AUTHWAY_ADMIN_API_KEY=' .env | cut -d= -f2)
          echo "::add-mask::$key"
          echo "ADMIN_KEY=$key" >> "$GITHUB_ENV"

      - name: Run sign-in scenarios against the installation
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/root.crt
          # The name resolves to both 127.0.0.1 and ::1; the ports are published
          # on IPv4 for certain.
          NODE_OPTIONS: --dns-result-order=ipv4first
          CONFORMANCE_ISSUER: https://auth.localtest.me:8443
          CONFORMANCE_API: https://auth.localtest.me:8443
          CONFORMANCE_ADMIN_KEY: ${{ env.ADMIN_KEY }}
          CONFORMANCE_MAIL_API: http://localhost:8025
        run: >-
          pnpm --filter @authway/conformance exec vitest run
          test/discovery.test.ts test/login.test.ts test/sessions.test.ts
          test/refresh-tokens.test.ts test/token-claims.test.ts
          test/magic-link.test.ts test/introspection.test.ts
          test/resource-server.test.ts test/device-authorization.test.ts
          test/admin-tenants-users.test.ts test/login-ui-routes.test.ts

      - name: Show the installation's logs
        if: failure()
        working-directory: ${{ runner.temp }}/bundle
        run: docker compose -f docker-compose.yml -f mail.yml logs --no-color --tail 200 || true

  # The two Vite apps live outside the pnpm workspace (each has its own
  # package-lock.json), so they were invisible to CI — their test suites only ever
  # ran on a developer machine. Build + test them here; no artifacts are uploaded
  # (CI verifies, the release pipeline publishes).
  # Node 24 (npm 11), the same toolchain the lockfiles are written with: npm 10
  # rejects an npm 11 lockfile that leaves out optional peer entries.
  apps:
    name: UI apps build / test / lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/central/admin
          - apps/branding/auth-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build (tsc + vite)
        working-directory: ${{ matrix.app }}
        run: npm run build

      - name: Test
        working-directory: ${{ matrix.app }}
        run: npx vitest run

      # eslint had no working config until the eslint 9 flat-config migration
      # (no .eslintrc file existed — `npm run lint` failed outright with
      # "ESLint couldn't find a configuration file"), so this step was never
      # meaningfully checkable before now.
      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint

  # The samples are what a newcomer runs first: they have to build.
  samples:
    name: .NET samples build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the server-side application sample
        run: dotnet build samples/asp-sample --nologo

      - name: Build the API sample
        run: dotnet build samples/asp-api --nologo

  clients:
    name: .NET clients build / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/csharp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The live tests need a deployment (AUTHWAY_CLIENT_TEST_*) and skip here; they run against a local one.
      # The end-to-end sign-in of Authway.Native runs in the conformance job (CONFORMANCE_NATIVE_CLIENTS).
      - name: Build and test Authway.Client and Authway.Native
        run: dotnet test --solution Authway.Client.slnx --configuration Release

  rust-client:
    name: Rust client fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/rust
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('clients/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      # The end-to-end sign-in runs in the conformance job (CONFORMANCE_NATIVE_CLIENTS).
      - name: Test
        run: cargo test --locked

  packages:
    name: TS packages build / typecheck / tarball verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # --config.strict-dep-builds=false: pnpm 10은 전이 postinstall (esbuild/sharp 등)을
        # 기본 strict 차단한다. 빌드 자체에는 tsup 내장 esbuild를 쓰므로 postinstall
        # 바이너리는 CI에서 꼭 필요하지 않다.
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build @authway/client
        run: pnpm --filter @authway/client build

      - name: Build @authway/react
        run: pnpm --filter @authway/react build

      - name: Typecheck @authway/client
        run: pnpm --filter @authway/client typecheck

      - name: Typecheck @authway/react
        run: pnpm --filter @authway/react typecheck

      - name: Lint @authway/client and @authway/react
        run: pnpm --filter @authway/client --filter @authway/react lint

      # Every file package.json points at must exist in the tarball, and each
      # condition (require/import) must resolve to matching types.
      - name: Check package manifests @authway/client and @authway/react
        run: pnpm --filter @authway/client --filter @authway/react lint:package

      - name: Test @authway/client
        run: pnpm --filter @authway/client exec vitest run

      - name: Test @authway/react
        run: pnpm --filter @authway/react exec vitest run

      # The browser sample is built against the packages in this repository,
      # so a change to their API that the sample does not follow fails here.
      - name: Build the React sample
        run: pnpm --dir samples/react-sdk-sample build

      # The conformance scenarios need a running provider, so CI only checks
      # that they compile.
      - name: Typecheck @authway/conformance
        run: pnpm --filter @authway/conformance typecheck

      # Guards against regression to `npm publish`, which leaves `workspace:*`
      # unresolved in the tarball and breaks every downstream `npm install`.
      - name: Verify tarballs contain no `workspace:` protocol
        run: |
          set -euo pipefail
          for pkg in client react; do
            pack_dir="$(mktemp -d)"
            extract_dir="$(mktemp -d)"
            (cd "packages/$pkg" && pnpm pack --pack-destination "$pack_dir" >/dev/null)
            tarball="$(ls "$pack_dir"/*.tgz | head -n1)"
            tar -xzf "$tarball" -C "$extract_dir"
            if grep -q '"workspace:' "$extract_dir/package/package.json"; then
              echo "::error::@authway/$pkg tarball contains unresolved 'workspace:' protocol"
              exit 1
            fi
            echo "✓ @authway/$pkg tarball verified"
          done
