packages:
  - 'packages/*'
  - 'packages/web/*'
  - 'examples/*'
  - 'samples/*'
  - 'samples/*/asp-frontend'

# pnpm 10+ is strict about transitive postinstall scripts.
# These are legitimate native-binary bootstraps from well-known packages:
#   esbuild — platform binary (pulled via vitest devDep, samples/react-sdk-sample)
#   sharp   — libvips image processing (pulled via samples/nextjs-sample → next)
onlyBuiltDependencies:
  - esbuild
  - sharp
